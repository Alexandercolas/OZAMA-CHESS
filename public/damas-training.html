<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https://ozama-chess.onrender.com">
  <script src="/mobile-runtime.js"></script>
  <meta name="theme-color" content="#0D0B08"/>
  <meta name="color-scheme" content="dark"/>
  <title>OZAMA CHESS - Entrenamiento de Damas</title>
  <meta name="description" content="Resuelve puzzles tácticos de Damas: el desafío del día o práctica libre, con racha y experiencia."/>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png?v=5">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <script src="/preferences.js?v=20260831-fase25"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--carbon); color: var(--text); font-family: var(--fb); min-height: 100vh; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; background: rgba(13,11,8,0.97);
      border-bottom: 1px solid rgba(200,152,60,0.18);
    }
    .topbar a.brand { color: var(--gold); font-family: var(--ft); font-weight: 900; letter-spacing: 3px; text-decoration: none; font-size: 15px; }
    .topbar a.back { color: var(--dim); text-decoration: none; font-size: 13px; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 60px; }
    .eyebrow { font-family: var(--fm); font-size: 10.5px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; text-align: center; }
    h1 { font-family: var(--ft); font-size: 26px; text-align: center; margin: 8px 0 20px; color: var(--text); }

    .stats-row { display: flex; gap: 10px; margin-bottom: 18px; }
    .stat-chip { flex: 1; background: var(--s1); border: 1px solid rgba(200,152,60,0.16); border-radius: 8px; padding: 10px 8px; text-align: center; }
    .stat-chip .v { font-family: var(--fm); font-weight: 700; font-size: 18px; color: var(--gold); }
    .stat-chip .l { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

    .mode-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .mode-tab {
      flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer;
      background: var(--s1); border: 1px solid rgba(200,152,60,0.16); color: var(--dim);
      font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .mode-tab.active { color: var(--gold); border-color: rgba(200,152,60,0.45); background: rgba(200,152,60,0.08); }

    .puzzle-card { background: var(--s1); border: 1px solid rgba(200,152,60,0.18); border-radius: 12px; padding: 18px; }
    .puzzle-title { font-family: var(--ft); font-size: 19px; color: var(--gold); text-align: center; margin-bottom: 4px; }
    .puzzle-desc { font-size: 12.5px; color: var(--dim); text-align: center; margin-bottom: 16px; }

    .board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1; border: 2px solid rgba(200,152,60,0.4); border-radius: 4px; overflow: hidden; }
    .sq { display: flex; align-items: center; justify-content: center; cursor: default; user-select: none; position: relative; }
    .sq.light { background: #2A241C; }
    .sq.dark { background: #17130E; cursor: pointer; }
    .sq.selected { background: rgba(200,152,60,0.35) !important; }
    .piece { width: 72%; height: 72%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 55%; }
    .piece.w { background: radial-gradient(circle at 35% 30%, #F3E6C5, #C8983C 75%); border: 2px solid #8B6914; }
    .piece.b { background: radial-gradient(circle at 35% 30%, #3A3630, #0B0906 75%); border: 2px solid #C8983C; }
    .piece .king { color: #C8983C; }
    .piece.w .king { color: #6B4712; }

    .feedback { margin-top: 14px; padding: 12px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: 700; display: none; }
    .feedback.ok { display: block; background: rgba(46,160,67,0.14); border: 1px solid rgba(46,160,67,0.4); color: #7FD98A; }
    .feedback.bad { display: block; background: rgba(200,60,60,0.12); border: 1px solid rgba(200,60,60,0.4); color: #E39494; }
    .feedback.info { display: block; background: rgba(200,152,60,0.1); border: 1px solid rgba(200,152,60,0.3); color: var(--gold); }

    .actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn { flex: 1; padding: 11px; border-radius: 8px; border: 1px solid rgba(200,152,60,0.3); background: rgba(200,152,60,0.08); color: var(--gold); font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-decoration: none; text-align: center; }
    .btn:hover { border-color: var(--gold); }

    .login-gate { text-align: center; padding: 60px 20px; color: var(--dim); }
    .login-gate a { color: var(--gold); font-weight: 700; text-decoration: none; }
    .loading { text-align: center; padding: 40px 20px; color: var(--dim); }
  </style>
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="/">OZAMA CHESS</a>
    <a class="back" href="/damas.html">← Damas</a>
  </nav>
  <div class="wrap" id="content">
    <div class="loading">Cargando...</div>
  </div>

  <script>
    let _token = '';
    let currentPuzzle = null;
    let currentMode = 'daily';
    let selected = null;
    let solving = false;

    function sqName(row, col) { return String.fromCharCode(97 + col) + (8 - row); }
    function isOwnPiece(ch) {
      if (!currentPuzzle || ch === '.') return false;
      const isWhite = ch.toLowerCase() === 'w';
      return currentPuzzle.turn === 'w' ? isWhite : !isWhite;
    }

    function renderShell() {
      document.getElementById('content').innerHTML = `
        <div class="eyebrow">Entrenamiento de Damas</div>
        <h1>Puzzles Tácticos</h1>
        <div class="stats-row" id="stats-row">
          <div class="stat-chip"><div class="v">—</div><div class="l">Resueltos</div></div>
          <div class="stat-chip"><div class="v">—</div><div class="l">Racha</div></div>
          <div class="stat-chip"><div class="v">—</div><div class="l">Nivel</div></div>
        </div>
        <div class="mode-tabs">
          <div class="mode-tab active" id="tab-daily" onclick="switchMode('daily')">Desafío del día</div>
          <div class="mode-tab" id="tab-practice" onclick="switchMode('practice')">Práctica libre</div>
        </div>
        <div class="puzzle-card" id="puzzle-card">
          <div class="loading">Cargando puzzle...</div>
        </div>
      `;
    }

    function switchMode(mode) {
      if (mode === currentMode) return;
      currentMode = mode;
      document.getElementById('tab-daily').classList.toggle('active', mode === 'daily');
      document.getElementById('tab-practice').classList.toggle('active', mode === 'practice');
      loadPuzzle();
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/damas-puzzles/stats', { headers: { Authorization: `Bearer ${_token}` }, cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        const chips = document.querySelectorAll('#stats-row .stat-chip .v');
        if (chips[0]) chips[0].textContent = data.totalSolved;
        if (chips[1]) chips[1].textContent = data.streak;
        if (chips[2]) chips[2].textContent = data.level;
      } catch (_) { /* silencioso */ }
    }

    async function loadPuzzle() {
      selected = null;
      const card = document.getElementById('puzzle-card');
      card.innerHTML = '<div class="loading">Cargando puzzle...</div>';
      try {
        const url = currentMode === 'daily' ? '/api/damas-puzzles/daily' : '/api/damas-puzzles/practice';
        const res = await fetch(url, { headers: { Authorization: `Bearer ${_token}` }, cache: 'no-store' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo cargar el puzzle.');
        currentPuzzle = data.puzzle;
        currentPuzzle._alreadyDone = !!data.alreadyDone;
        renderPuzzle();
      } catch (err) {
        card.innerHTML = `<div class="feedback bad" style="display:block">${escapeHtml(err.message || 'Error al cargar el puzzle.')}</div>`;
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
    }

    function renderPuzzle() {
      const card = document.getElementById('puzzle-card');
      const turnLabel = currentPuzzle.turn === 'w' ? 'Juegan blancas' : 'Juegan negras';
      card.innerHTML = `
        <div class="puzzle-title">${escapeHtml(currentPuzzle.title)}</div>
        <div class="puzzle-desc">${escapeHtml(currentPuzzle.description)} · ${turnLabel}</div>
        <div class="board" id="board"></div>
        <div class="feedback" id="feedback"></div>
        <div class="actions" id="actions"></div>
      `;
      if (currentMode === 'daily' && currentPuzzle._alreadyDone) {
        document.getElementById('feedback').className = 'feedback info';
        document.getElementById('feedback').style.display = 'block';
        document.getElementById('feedback').textContent = 'Ya resolviste el desafío de hoy. Vuelve mañana por uno nuevo, o prueba la práctica libre.';
      }
      renderBoard();
    }

    function renderBoard() {
      const board = document.getElementById('board');
      if (!board || !currentPuzzle) return;
      let html = '';
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const ch = currentPuzzle.rows[row][col];
          const dark = (row + col) % 2 === 1;
          const isSel = selected && selected.row === row && selected.col === col;
          let piece = '';
          if (ch !== '.') {
            const isWhite = ch.toLowerCase() === 'w';
            const isKing = ch === ch.toUpperCase();
            piece = `<div class="piece ${isWhite ? 'w' : 'b'}">${isKing ? '<span class="king">♛</span>' : ''}</div>`;
          }
          const clickable = dark ? `onclick="onSquareClick(${row},${col})"` : '';
          html += `<div class="sq ${dark ? 'dark' : 'light'} ${isSel ? 'selected' : ''}" data-row="${row}" data-col="${col}" ${clickable}>${piece}</div>`;
        }
      }
      board.innerHTML = html;
    }

    function onSquareClick(row, col) {
      if (!currentPuzzle || solving) return;
      const ch = currentPuzzle.rows[row][col];
      if (!selected) {
        if (isOwnPiece(ch)) { selected = { row, col }; renderBoard(); }
        return;
      }
      if (selected.row === row && selected.col === col) { selected = null; renderBoard(); return; }
      if (isOwnPiece(ch)) { selected = { row, col }; renderBoard(); return; }
      const from = sqName(selected.row, selected.col);
      const to = sqName(row, col);
      selected = null;
      renderBoard();
      attemptMove(from, to);
    }

    async function attemptMove(from, to) {
      solving = true;
      const feedback = document.getElementById('feedback');
      feedback.className = 'feedback info';
      feedback.style.display = 'block';
      feedback.textContent = 'Verificando...';
      try {
        const res = await fetch(`/api/damas-puzzles/${currentPuzzle.key}/solve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
          body: JSON.stringify({ moves: [{ from, to }], mode: currentMode }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al verificar la jugada.');

        if (!data.correct) {
          feedback.className = 'feedback bad';
          feedback.textContent = 'No es la jugada. Prueba de nuevo.';
          solving = false;
          return;
        }

        feedback.className = 'feedback ok';
        if (data.alreadyCompleted) {
          feedback.textContent = '¡Correcto! (Ya habías completado el desafío de hoy, sin XP extra.)';
        } else {
          const parts = [`¡Correcto! +${data.xpGained} XP`];
          if (data.newAchievements && data.newAchievements.length) parts.push(`🏆 ¡Nuevo logro desbloqueado!`);
          feedback.textContent = parts.join(' · ');
        }
        loadStats();

        const actions = document.getElementById('actions');
        if (currentMode === 'practice') {
          actions.innerHTML = `<button class="btn" onclick="loadPuzzle()">Siguiente puzzle →</button>`;
        } else {
          actions.innerHTML = `<a class="btn" href="/damas.html">Volver a Damas</a>`;
        }
      } catch (err) {
        feedback.className = 'feedback bad';
        feedback.textContent = err.message || 'Error al verificar la jugada.';
      }
      solving = false;
    }

    async function init() {
      window.OZAMA_RUNTIME && await window.OZAMA_RUNTIME.ready;
      _token = window.OZAMA_RUNTIME?.getAuthToken?.() || '';
      let user = null;
      try { user = JSON.parse(localStorage.getItem('ozama-user') || 'null'); } catch (_) { user = null; }

      if (!user || (window.OZAMA_RUNTIME?.native && !_token)) {
        document.getElementById('content').innerHTML = `
          <div class="login-gate">
            Inicia sesión para entrenar con puzzles de Damas y guardar tu progreso.<br><br>
            <a href="/login.html">Iniciar sesión →</a>
          </div>`;
        return;
      }

      renderShell();
      loadStats();
      loadPuzzle();
    }

    window.switchMode = switchMode;
    window.onSquareClick = onSquareClick;
    window.loadPuzzle = loadPuzzle;
    init();
  </script>
</body>
</html>
