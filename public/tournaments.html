<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://flagcdn.com; media-src 'self'; connect-src 'self' https://ozama-chess.onrender.com wss://ozama-chess.onrender.com ws: wss:">
  <script src="/mobile-runtime.js"></script>
  <meta name="theme-color" content="#0D0B08"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="OZAMA CHESS"/>
  <title>OZAMA CHESS - Torneos</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png?v=5">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=5">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--carbon); color: var(--text); font-family: var(--fb); min-height: 100vh; padding: 0 0 60px; }

    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 24px;
      background: rgba(13,11,8,0.97);
      border-bottom: 1px solid rgba(200,152,60,0.18);
      gap: 12px; min-width: 0;
    }
    .topbar-logo {
      font-family: var(--ft); font-size: 16px; font-weight: 900;
      color: var(--gold); letter-spacing: 4px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 10px; min-width: 0;
    }
    .topbar-logo-mark { width: 32px; height: 32px; flex: 0 0 auto; display: block; object-fit: cover; border-radius: 50%; border: 1px solid rgba(200,152,60,0.48); }
    .topbar-nav { display: flex; align-items: center; gap: 16px; }
    .topbar-nav a { color: var(--dim); text-decoration: none; font-size: 11px; font-weight: 600; letter-spacing: 2px; }
    .topbar-nav a:hover { color: var(--gold); }

    .container { max-width: 900px; margin: 0 auto; padding: 28px 20px 0; }
    .page-title { font-family: var(--ft); font-size: 28px; font-weight: 700; color: var(--gold); letter-spacing: 1px; margin-bottom: 6px; }
    .page-sub { color: var(--dim); font-size: 13px; margin-bottom: 24px; }

    .t-card { padding: 20px; margin-bottom: 16px; cursor: pointer; }
    .t-card:hover { border-color: rgba(200,152,60,0.3); }
    .t-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .t-name { font-family: var(--ft); font-size: 19px; font-weight: 700; color: var(--text); }
    .t-status { padding: 3px 10px; border-radius: 12px; font-size: 9px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; border: 1px solid rgba(200,152,60,0.3); color: var(--gold); background: rgba(200,152,60,0.08); }
    .t-status.is-active { color: #2ecc71; border-color: rgba(46,204,113,0.3); background: rgba(46,204,113,0.08); }
    .t-status.is-finished { color: var(--dim); }
    .game-badge { padding: 3px 10px; border-radius: 12px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; color: var(--gold-2); background: rgba(200,152,60,0.08); border: 1px solid rgba(200,152,60,0.18); white-space: nowrap; }
    .t-desc { color: var(--dim); font-size: 12.5px; margin-top: 8px; line-height: 1.5; }
    .t-meta { display: flex; gap: 16px; margin-top: 12px; font-size: 11px; color: var(--dim); letter-spacing: 0.5px; flex-wrap: wrap; }
    .t-meta strong { color: var(--gold-2); }

    .empty-msg, .loading { text-align: center; padding: 40px 20px; color: var(--dim); font-size: 13px; letter-spacing: 2px; }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(200,152,60,0.15); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .back-link { display: inline-block; color: var(--dim); font-size: 11px; letter-spacing: 1.5px; text-decoration: none; margin-bottom: 18px; text-transform: uppercase; }
    .back-link:hover { color: var(--gold); }

    .detail-hero { padding: 22px; margin-bottom: 20px; }
    .detail-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

    .your-match-card { padding: 18px; margin-bottom: 20px; border-color: rgba(46,204,113,0.4); background: rgba(46,204,113,0.05); }
    .your-match-title { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #2ecc71; margin-bottom: 8px; }
    .your-match-vs { font-family: var(--ft); font-size: 18px; color: var(--text); margin-bottom: 12px; }

    .champion-banner { padding: 22px; margin-bottom: 20px; text-align: center; border-color: rgba(200,152,60,0.5); background: rgba(200,152,60,0.06); }
    .champion-banner .crown { font-size: 32px; }
    .champion-banner .name { font-family: var(--ft); font-size: 22px; color: var(--gold); margin-top: 6px; }

    .round-block { margin-bottom: 22px; }
    .round-title { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(200,152,60,0.1); }
    .match-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-radius: 8px; background: var(--s2); border: 1px solid rgba(200,152,60,0.08); margin-bottom: 8px; flex-wrap: wrap; }
    .match-players { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
    .match-players .p { color: var(--text); }
    .match-players .p.is-winner { color: #2ecc71; font-weight: 700; }
    .match-players .vs { color: var(--dim); font-size: 10px; }
    .match-status { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--s3); border: 1px solid rgba(200,152,60,0.3); color: var(--text); padding: 10px 18px; border-radius: 8px; font-size: 12px; z-index: 999; display: none; }
  </style>
</head>
<body>
  <nav class="topbar">
    <a href="/lobby.html" class="topbar-logo"><img class="topbar-logo-mark" src="/favicon.png?v=6" alt="">OZAMA CHESS</a>
    <div class="topbar-nav">
      <a href="/lobby.html">Lobby</a>
    </div>
  </nav>

  <div class="container" id="main-content">
    <div class="loading"><div class="spinner"></div>Cargando...</div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/vendor/socket.io.min.js"></script>
  <script>
    (async () => {
    await window.OZAMA_RUNTIME?.ready;
    const _user  = JSON.parse(localStorage.getItem('ozama-user') || 'null');
    const _token = window.OZAMA_RUNTIME?.getAuthToken?.() || '';
    const main = document.getElementById('main-content');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
    }

    function showToast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3000);
    }

    function fmtDate(value) {
      if (!value) return 'Sin fecha';
      try { return new Date(value).toLocaleDateString('es-DO', { day: 'numeric', month: 'short', year: 'numeric' }); }
      catch (_) { return 'Sin fecha'; }
    }

    const statusLabels = { draft: 'Proximamente', published: 'Inscripciones abiertas', active: 'En curso', finished: 'Finalizado', cancelled: 'Cancelado', closed: 'Cerrado' };
    const gameLabels = { chess: '♟ Ajedrez', checkers: '⚫ Damas' };

    function eventIdFromUrl() {
      return new URLSearchParams(window.location.search).get('id');
    }

    async function loadList() {
      main.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando torneos...</div>';
      try {
        const res = await fetch('/api/events', { cache: 'no-store' });
        const data = await res.json();
        const tournaments = (data.events || []).filter((e) => e.type === 'tournament');
        if (!tournaments.length) {
          main.innerHTML = `
            <div class="page-title">Torneos</div>
            <div class="page-sub">Competencias de eliminacion directa entre jugadores de OZAMA.</div>
            <div class="empty-msg">No hay torneos abiertos ahora mismo. Vuelve pronto.</div>
          `;
          return;
        }
        main.innerHTML = `
          <div class="page-title">Torneos</div>
          <div class="page-sub">Competencias de eliminacion directa entre jugadores de OZAMA.</div>
          ${tournaments.map((t) => `
            <div class="t-card oz-card oz-enter" onclick="window.location.href='/tournaments.html?id=${t._id}'">
              <div class="t-top">
                <div class="t-name">${escapeHtml(t.title)}</div>
                <div class="t-status${t.status === 'active' ? ' is-active' : t.status === 'finished' ? ' is-finished' : ''}">${statusLabels[t.status] || t.status}</div>
              </div>
              <div class="game-badge" style="margin-top:8px;display:inline-block;">${gameLabels[t.gameType] || gameLabels.chess}</div>
              <div class="t-desc">${escapeHtml(t.description || '')}</div>
              <div class="t-meta">
                <span>Inicio: <strong>${fmtDate(t.startsAt)}</strong></span>
                <span><strong>${t.participantCount || 0}/${t.maxPlayers || 16}</strong> inscritos</span>
              </div>
            </div>
          `).join('')}
        `;
      } catch (_) {
        main.innerHTML = '<div class="empty-msg">No se pudo cargar la lista de torneos.</div>';
      }
    }

    let _socket = null;
    function getSocket() {
      if (_socket) return _socket;
      _socket = io(window.OZAMA_RUNTIME?.socketOrigin, { auth: { token: _token }, withCredentials: true });
      return _socket;
    }

    function goToMatch(code, color, roomToken, playerInfo) {
      sessionStorage.removeItem('ozama-bot-mode');
      sessionStorage.removeItem('ozama-bot-color');
      sessionStorage.removeItem('ozama-bot-difficulty');
      sessionStorage.removeItem('ozama-local-game');
      sessionStorage.setItem('ozama-room', String(code || '').toUpperCase());
      sessionStorage.setItem('ozama-color', color);
      sessionStorage.setItem('ozama-myname', _user?.username || '');
      if (roomToken) sessionStorage.setItem('ozama-room-token', roomToken);
      if (playerInfo) sessionStorage.setItem('ozama-player-info', JSON.stringify(playerInfo));
      window.location.href = '/game.html';
    }

    // Torneo de Damas: la sala se arma del lado del servidor ya lista
    // (status:'playing'), y en vez de reimplementar el flujo de
    // "entrar" del lado del cliente, se reusa el mismo camino que
    // damas.html ya tiene para RECONECTARSE (ozama-damas-online-session
    // + attemptAutoRejoin -> damas:rejoin) -- funciona igual la
    // primera vez que se entra que al recargar la pagina.
    function goToDamasMatch(code, color, roomToken) {
      sessionStorage.setItem('ozama-damas-online-session', JSON.stringify({ code, color, token: roomToken }));
      window.location.href = '/damas.html';
    }

    function playYourMatch(eventId, round, matchIndex, btn, gameType) {
      if (!_user) { window.location.href = '/login.html'; return; }
      if (btn) { btn.disabled = true; btn.textContent = 'Conectando...'; }
      const socket = getSocket();
      const isDamas = gameType === 'checkers';
      const readyEvent = isDamas ? 'tournament:damas-match-ready' : 'game-start';
      const onReady = ({ code, color, roomToken, playerInfo }) => {
        cleanup();
        if (isDamas) goToDamasMatch(code, color, roomToken);
        else goToMatch(code, color, roomToken, playerInfo);
      };
      const onError = (message) => {
        cleanup();
        showToast(message || 'No se pudo entrar al partido.');
        if (btn) { btn.disabled = false; btn.textContent = 'Jugar mi partida'; }
      };
      function cleanup() {
        socket.off(readyEvent, onReady);
        socket.off('tournament:error', onError);
      }
      socket.on(readyEvent, onReady);
      socket.on('tournament:error', onError);
      socket.emit(isDamas ? 'tournament:join-match-damas' : 'tournament:join-match', { eventId, round, matchIndex });
    }

    async function joinTournament(id) {
      try {
        const res = await fetch(`/api/events/${id}/join`, { method: 'POST', headers: { Authorization: `Bearer ${_token}` } });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'No se pudo inscribir.');
        showToast('Te inscribiste al torneo.');
        loadDetail(id);
      } catch (err) { showToast(err.message); }
    }

    async function leaveTournament(id) {
      try {
        const res = await fetch(`/api/events/${id}/leave`, { method: 'POST', headers: { Authorization: `Bearer ${_token}` } });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'No se pudo salir.');
        showToast('Saliste del torneo.');
        loadDetail(id);
      } catch (err) { showToast(err.message); }
    }

    function matchPlayerLabel(name, winnerId, playerId) {
      const label = escapeHtml(name || 'Por definir');
      const isWinner = winnerId && playerId && String(winnerId) === String(playerId);
      return `<span class="p${isWinner ? ' is-winner' : ''}">${label}</span>`;
    }

    function renderBracket(bracket) {
      if (!bracket?.rounds?.length) return '';
      return bracket.rounds.map((round, ri) => `
        <div class="round-block">
          <div class="round-title">Ronda ${ri + 1}</div>
          ${round.matches.map((m) => `
            <div class="match-row">
              <div class="match-players">
                ${matchPlayerLabel(m.player1Name, m.winner, m.player1)}
                <span class="vs">vs</span>
                ${m.status === 'bye' ? '<span class="p" style="color:var(--dim);">(bye)</span>' : matchPlayerLabel(m.player2Name, m.winner, m.player2)}
              </div>
              <div class="match-status">${m.status === 'finished' ? 'Terminado' : m.status === 'bye' ? 'Avance directo' : m.status === 'playing' ? 'Jugando' : 'Listo'}</div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    async function loadDetail(id) {
      main.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando torneo...</div>';
      try {
        const res = await fetch(`/api/events/${id}`, { headers: _token ? { Authorization: `Bearer ${_token}` } : {}, cache: 'no-store' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Torneo no encontrado.');
        const event = data.event;

        const championHtml = event.bracket?.championName ? `
          <div class="champion-banner oz-card oz-enter">
            <div class="crown">🏆</div>
            <div class="your-match-title" style="color:var(--gold);">Campeon del torneo</div>
            <div class="name">${escapeHtml(event.bracket.championName)}</div>
          </div>
        ` : '';

        const yourMatchHtml = data.yourMatch ? `
          <div class="your-match-card oz-card oz-enter">
            <div class="your-match-title">Tu partido -- Ronda ${data.yourMatch.round + 1}</div>
            <div class="your-match-vs">Vs. ${escapeHtml(data.yourMatch.opponentName || 'Por definir')}</div>
            <button class="btn-primary" id="play-match-btn">Jugar mi partida</button>
          </div>
        ` : '';

        let joinAction = '';
        if (_user) {
          if (data.youJoined && ['draft', 'published'].includes(event.status)) {
            joinAction = `<button class="btn-danger" id="leave-btn">Salir del torneo</button>`;
          } else if (data.canJoin) {
            joinAction = `<button class="btn-primary" id="join-btn">Inscribirme</button>`;
          } else if (data.youJoined) {
            joinAction = `<span style="color:var(--dim);font-size:12px;">Ya estas inscrito.</span>`;
          }
        } else {
          joinAction = `<a class="btn-primary" href="/login.html" style="text-decoration:none;display:inline-flex;align-items:center;">Inicia sesion para inscribirte</a>`;
        }

        main.innerHTML = `
          <a class="back-link" href="/tournaments.html">← Todos los torneos</a>
          <div class="detail-hero oz-card oz-enter">
            <div class="t-top">
              <div class="t-name" style="font-size:24px;">${escapeHtml(event.title)}</div>
              <div class="t-status${event.status === 'active' ? ' is-active' : event.status === 'finished' ? ' is-finished' : ''}">${statusLabels[event.status] || event.status}</div>
            </div>
            <div class="game-badge" style="margin:6px 0;display:inline-block;">${gameLabels[event.gameType] || gameLabels.chess}</div>
            <div class="t-desc">${escapeHtml(event.description || '')}</div>
            <div class="t-meta">
              <span>Inicio: <strong>${fmtDate(event.startsAt)}</strong></span>
              <span><strong>${(event.participants || []).length}/${event.maxPlayers || 16}</strong> inscritos</span>
            </div>
            <div class="detail-actions">${joinAction}</div>
          </div>
          ${championHtml}
          ${yourMatchHtml}
          ${renderBracket(event.bracket)}
          ${!event.bracket?.rounds?.length ? '<div class="empty-msg">El bracket todavia no se genero -- esperando a que el torneo empiece.</div>' : ''}
        `;

        document.getElementById('join-btn')?.addEventListener('click', () => joinTournament(id));
        document.getElementById('leave-btn')?.addEventListener('click', () => leaveTournament(id));
        document.getElementById('play-match-btn')?.addEventListener('click', (e) => {
          playYourMatch(id, data.yourMatch.round, data.yourMatch.matchIndex, e.target, event.gameType);
        });
      } catch (err) {
        main.innerHTML = `<a class="back-link" href="/tournaments.html">← Todos los torneos</a><div class="empty-msg">${escapeHtml(err.message || 'No se pudo cargar el torneo.')}</div>`;
      }
    }

    const id = eventIdFromUrl();
    if (id) loadDetail(id); else loadList();
    })();
  </script>
</body>
</html>
