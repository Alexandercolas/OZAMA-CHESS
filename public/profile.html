<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <meta name="theme-color" content="#0D0B08"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>

  <title>OZAMA CHESS - Perfil</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png?v=5">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=5">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: var(--carbon);
      --surface: var(--s1);
      --surface2: var(--s2);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--fb);
      min-height: 100vh;
      padding: 0 0 60px;
      overflow-x: hidden;
    }

    /* Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 24px;
      background: rgba(13,11,8,0.97);
      border-bottom: 1px solid rgba(200,152,60,0.18);
      gap: 12px;
      min-width: 0;
    }

    .topbar-logo {
      font-family: var(--ft);
      font-size: 16px; font-weight: 900;
      color: var(--gold); letter-spacing: 4px;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 10px;
      min-width: 0;
    }
    .topbar-logo-mark {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid rgba(200,152,60,0.48);
      box-shadow: 0 0 14px rgba(200,152,60,0.22);
    }

    .topbar-nav { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 16px; }
    .topbar-nav a {
      color: var(--dim); text-decoration: none;
      font-size: 11px; font-weight: 600; letter-spacing: 2px;
      transition: color 0.2s;
    }
    .topbar-nav a:hover { color: var(--gold); }

    /* Hero del perfil */
    .profile-hero {
      background: linear-gradient(160deg, var(--s2) 0%, var(--s1) 100%);
      border-bottom: 1px solid rgba(200,152,60,0.16);
      padding: 40px 24px 32px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }

    .avatar-ring {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #8B6914);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--ft);
      font-size: 36px; font-weight: 900; color: var(--carbon);
      box-shadow: 0 0 30px rgba(200,152,60,0.3);
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar-ring.premium {
      box-shadow: 0 0 0 3px rgba(200,152,60,0.85), 0 0 34px rgba(200,152,60,0.4);
    }
    /* Marcos de perfil (Fase 13, ver /collection.html). Si ademas es
       Premium, el marco elegido gana -- son cosas independientes. */
    .avatar-ring[data-frame="bronce"] { box-shadow: 0 0 0 4px #8B5A2B; }
    .avatar-ring[data-frame="plata"] { box-shadow: 0 0 0 4px #C7CCD1; }
    .avatar-ring[data-frame="oro"] { box-shadow: 0 0 0 4px #FFD34D; }
    .avatar-ring[data-frame="racha"] { box-shadow: 0 0 0 4px #E2571C, 0 0 14px 2px rgba(226,87,28,0.5); }
    .avatar-ring[data-frame="tactico"] { box-shadow: 0 0 0 4px #3F7D4E; }
    .avatar-ring[data-frame="cazador"] { box-shadow: 0 0 0 4px #7A1F2B; }
    .avatar-ring[data-frame="centenario"] { box-shadow: 0 0 0 4px #6B4A2A; }
    .avatar-ring[data-frame="campeon"] { box-shadow: 0 0 0 4px #FFD700, 0 0 18px 3px rgba(255,215,0,0.55); }
    .avatar-ring img,
    .avatar-choice img,
    .friend-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar-0 { background: linear-gradient(135deg, var(--blue-do), var(--gold)); }
    .avatar-1 { background: linear-gradient(135deg, var(--red-do), var(--gold)); }
    .avatar-2 { background: linear-gradient(135deg, #226F54, var(--gold)); }
    .avatar-3 { background: linear-gradient(135deg, #5B2A86, var(--gold)); }
    .avatar-4 { background: linear-gradient(135deg, #0F766E, var(--gold)); }
    .avatar-5 { background: linear-gradient(135deg, var(--teja), var(--gold)); }

    .profile-name {
      font-family: var(--ft);
      font-size: 24px; font-weight: 700; color: var(--gold);
      letter-spacing: 2px;
    }

    .profile-meta {
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; color: var(--dim);
    }

    .profile-country { font-size: 20px; }
    .country-code {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 28px; height: 20px;
      border: 1px solid rgba(200,152,60,0.18);
      color: var(--gold);
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      background: rgba(200,152,60,0.06);
    }

    .elo-display {
      background: rgba(200,152,60,0.1);
      border: 1px solid rgba(200,152,60,0.3);
      border-radius: 20px; padding: 6px 18px;
      font-family: var(--ft);
      font-size: 14px; font-weight: 700; color: var(--gold);
      letter-spacing: 2px;
    }

    .plan-badge {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 14px;
      border: 1px solid rgba(200,152,60,0.24);
      background: rgba(200,152,60,0.06);
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .plan-badge.premium {
      color: var(--gold);
      border-color: rgba(200,152,60,0.44);
      box-shadow: 0 0 18px rgba(200,152,60,0.16);
    }

    .rank-badge {
      font-family: var(--ft);
      font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
      color: var(--gold-2, var(--gold));
    }
    .rank-badge::before { content: '\2726  '; }

    .identity-panel { padding: 20px; margin-bottom: 28px; }
    .identity-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .identity-item { text-align: center; }
    .identity-value {
      font-family: var(--ft); font-size: 20px; font-weight: 800; color: var(--text);
    }
    .identity-label {
      font-size: 10px; font-weight: 600; letter-spacing: 1.5px; color: var(--dim);
      text-transform: uppercase; margin-top: 4px;
    }
    .style-title {
      font-family: var(--ft); font-size: 15px; font-weight: 700; color: var(--gold);
      letter-spacing: 1px; margin: 6px 0 12px;
      padding-top: 16px; border-top: 1px solid rgba(200,152,60,0.1);
    }
    .style-grid { display: grid; gap: 8px; }
    .style-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; border-radius: 8px; background: var(--surface2);
      font-size: 12.5px;
    }
    .style-item .style-name { color: var(--text); }
    .style-item .style-value { color: var(--gold); font-weight: 700; }
    .style-item .style-value.is-empty { color: var(--dim); font-weight: 400; font-style: italic; }

    #elo-chart-wrap { margin-bottom: 4px; }
    #elo-chart-wrap svg { width: 100%; height: 90px; display: block; }
    .elo-chart-empty { text-align: center; padding: 20px; color: var(--dim); font-size: 12px; }
    .elo-chart-summary { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-top: 4px; letter-spacing: 0.5px; }
    .elo-chart-summary strong { color: var(--gold); }

    .progression-panel { padding: 20px; margin-bottom: 28px; }
    .level-row { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
    .level-badge {
      flex-shrink: 0;
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      background: linear-gradient(135deg, var(--gold), #8B6914);
      color: var(--carbon); font-family: var(--ft); font-weight: 900;
    }
    .level-badge .lv-num { font-size: 18px; line-height: 1; }
    .level-badge .lv-lbl { font-size: 7px; letter-spacing: 1px; }
    .level-info { flex: 1; min-width: 0; }
    .level-xp-text { font-size: 11px; color: var(--dim); margin-bottom: 5px; letter-spacing: 0.5px; }
    .xp-bar-track { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
    .xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-2, var(--gold))); border-radius: 4px; transition: width 0.4s ease; }

    .achievements-title {
      font-family: var(--ft); font-size: 15px; font-weight: 700; color: var(--gold);
      letter-spacing: 1px; margin: 18px 0 12px;
      padding-top: 16px; border-top: 1px solid rgba(200,152,60,0.1);
    }
    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .achievement-badge {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 14px 8px; border-radius: 10px;
      background: var(--surface2); border: 1px solid rgba(200,152,60,0.08);
      text-align: center;
    }
    .achievement-badge.is-unlocked { border-color: rgba(200,152,60,0.35); background: rgba(200,152,60,0.06); }
    .achievement-icon { font-size: 26px; }
    .achievement-badge:not(.is-unlocked) .achievement-icon { filter: grayscale(1); opacity: 0.35; }
    .achievement-name { font-size: 11px; font-weight: 700; color: var(--text); }
    .achievement-badge:not(.is-unlocked) .achievement-name { color: var(--dim); }
    .achievement-desc { font-size: 9.5px; color: var(--dim); line-height: 1.4; }

    /* Stats grid */
    .container { max-width: 800px; margin: 0 auto; padding: 28px 20px 0; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      padding: 18px 14px;
      text-align: center;
    }

    .stat-value {
      font-family: var(--ft);
      font-size: 28px; font-weight: 900; color: var(--gold);
      line-height: 1;
    }

    .stat-label {
      font-size: 10px; font-weight: 600;
      letter-spacing: 2px; color: var(--dim);
      text-transform: uppercase; margin-top: 6px;
    }

    .stat-card.wins   .stat-value { color: #2ecc71; }
    .stat-card.losses .stat-value { color: var(--danger); }
    .stat-card.draws  .stat-value { color: var(--dim); }

    /* Estadisticas avanzadas (beneficio Premium) */
    .adv-stats-panel { padding: 20px; margin-bottom: 28px; }
    .adv-stats-title {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
    }
    .adv-stats-title .section-title { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .adv-pro-tag {
      padding: 2px 8px; border-radius: 4px;
      border: 1px solid rgba(200,152,60,0.44);
      background: rgba(200,152,60,0.1);
      color: var(--gold); font-size: 9px; font-weight: 800;
      letter-spacing: 1.5px;
    }
    .adv-color-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin-bottom: 16px;
    }
    .adv-color-card {
      padding: 14px; border-radius: 10px;
      background: var(--surface2);
      border: 1px solid rgba(200,152,60,0.1);
    }
    .adv-color-label {
      font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--dim); margin-bottom: 8px;
    }
    .adv-color-rate {
      font-family: var(--ft); font-size: 24px; font-weight: 800; color: var(--gold);
      line-height: 1;
    }
    .adv-color-detail { font-size: 11px; color: var(--dim); margin-top: 4px; }
    .adv-duration { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
    .adv-duration strong { color: var(--gold); }
    .adv-openings-title { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
    .adv-opening-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid rgba(200,152,60,0.06);
      font-size: 13px;
    }
    .adv-opening-row:last-child { border-bottom: none; }
    .adv-opening-count { color: var(--gold); font-weight: 700; font-family: var(--fm); }
    .adv-locked {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      gap: 10px; padding: 20px 10px; color: var(--dim); font-size: 12.5px; line-height: 1.6;
    }
    .adv-locked a { color: var(--gold); font-weight: 700; text-decoration: none; }

    /* Seccion historial */
    .section-title {
      font-family: var(--ft);
      font-size: 13px; font-weight: 700;
      color: var(--gold); letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(200,152,60,0.1);
    }

    /* Lista de partidas */
    .match-list { display: flex; flex-direction: column; gap: 8px; }

    .match-row {
      background: var(--surface);
      border: 1px solid rgba(200,152,60,0.08);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 14px;
      transition: border-color 0.2s;
    }
    .match-row:hover { border-color: rgba(200,152,60,0.2); }

    .match-result-badge {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .badge-win  { background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.3); }
    .badge-loss { background: rgba(231,76,60,0.15);  border: 1px solid rgba(231,76,60,0.3); }
    .badge-draw { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); }

    .match-info { flex: 1; min-width: 0; }

    .match-vs {
      font-size: 14px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .match-detail {
      font-size: 11px; color: var(--dim);
      letter-spacing: 1px; margin-top: 3px;
      overflow: hidden; text-overflow: ellipsis;
    }

    .match-elo-change {
      font-size: 13px; font-weight: 700;
      letter-spacing: 1px; flex-shrink: 0;
      text-align: right;
    }
    .elo-up   { color: #2ecc71; }
    .elo-down { color: #e74c3c; }
    .elo-flat { color: var(--dim); }

    .match-date {
      font-size: 10px; color: var(--dim);
      letter-spacing: 1px; flex-shrink: 0;
      text-align: right; min-width: 60px;
    }

    /* Loading / empty */
    .loading {
      text-align: center; padding: 40px 20px;
      color: var(--dim); font-size: 13px; letter-spacing: 2px;
    }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(200,152,60,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-msg {
      text-align: center; padding: 32px 20px;
      color: var(--dim); font-size: 12px; letter-spacing: 2px;
    }

    /* Edit pais */
    .edit-section {
      padding: 20px;
      margin-bottom: 28px;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }

    .edit-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 2px; color: var(--dim);
      text-transform: uppercase; flex-shrink: 0;
    }

    .avatar-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .avatar-choice {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(200,152,60,0.25);
      color: white;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .avatar-choice:hover,
    .avatar-choice.active {
      transform: translateY(-1px);
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(200,152,60,0.25);
    }

    .edit-select {
      flex: 1; min-width: 160px;
      padding: 8px 12px;
      background: var(--surface2);
      border: 1px solid rgba(200,152,60,0.2);
      border-radius: 8px; color: var(--text);
      font-family: var(--fb);
      font-size: 14px; outline: none; cursor: pointer;
      appearance: none;
    }
    .edit-select:focus { border-color: var(--gold); }
    .edit-select option { background: var(--s2); }

    .btn-save {
      padding: 11px 22px;
      font-size: 11px;
      letter-spacing: 2px;
    }
    .btn-save.secondary {
      color: rgba(233,228,218,0.52);
    }

    .photo-upload {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 8px 12px;
      border: 1px solid rgba(200,152,60,0.25);
      border-radius: 8px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      background: rgba(200,152,60,0.06);
    }
    .photo-upload:hover {
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(200,152,60,0.18);
    }
    .photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .photo-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .photo-hint {
      width: 100%;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 1px;
    }
    .photo-status {
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .friends-panel {
      padding: 18px;
      margin-bottom: 28px;
    }
    .friends-form {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .friends-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      background: var(--surface2);
      border: 1px solid rgba(200,152,60,0.18);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--fb);
      outline: none;
    }
    .friends-input:focus { border-color: var(--gold); }
    .friends-list { display: grid; gap: 8px; }
    .friend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid rgba(200,152,60,0.08);
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
    }
    .friend-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-family: var(--ft);
      font-weight: 900;
      color: #080808;
      background: linear-gradient(135deg, var(--gold), #8B6914);
    }
    .friend-main { flex: 1; min-width: 0; }
    .friend-name { font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .friend-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }

    .account-panel {
      margin-bottom: 28px;
      padding: 20px;
    }
    .account-links { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 16px; }
    .account-links a {
      padding: 8px 11px;
      border: 1px solid rgba(200,152,60,0.17);
      border-radius: 4px;
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-decoration: none;
      text-transform: uppercase;
    }
    .account-links a:hover { border-color: var(--gold); color: var(--gold); }
    .danger-zone { border-top: 1px solid rgba(203,72,58,0.26); padding-top: 14px; }
    .danger-zone summary {
      color: #d98275;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .danger-copy { margin: 13px 0; color: var(--dim); font-size: 12px; line-height: 1.55; }
    .danger-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 9px; }
    .danger-form input {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid rgba(203,72,58,0.28);
      border-radius: 4px;
      outline: 0;
      color: var(--text);
      background: rgba(0,0,0,0.28);
    }
    .danger-form input:focus { border-color: #d98275; }
    .btn-delete {
      padding: 10px 15px;
      border: 1px solid rgba(203,72,58,0.62);
      border-radius: 4px;
      color: #f1d8d3;
      background: rgba(139,35,27,0.24);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn-delete:disabled { opacity: 0.45; cursor: wait; }
    .delete-status { min-height: 18px; margin-top: 9px; color: #d98275; font-size: 11px; }

    .save-msg {
      font-size: 11px; color: #2ecc71;
      letter-spacing: 1px; display: none;
    }

    .plan-note {
      width: 100%;
      padding-top: 12px;
      border-top: 1px solid rgba(200,152,60,0.08);
      color: var(--dim);
      font-size: 12px;
      line-height: 1.55;
    }

    .plan-note strong { color: var(--gold); font-family: var(--ft); letter-spacing: 1px; }

    /* Paginacion */
    .pagination {
      display: flex; justify-content: center; gap: 8px; margin-top: 20px;
    }

    .page-btn {
      padding: 7px 14px;
      background: var(--surface);
      border: 1px solid rgba(200,152,60,0.15);
      border-radius: 8px; color: var(--dim);
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    a.page-btn { text-decoration: none; display: inline-block; }
    .page-btn:hover, .page-btn.active {
      border-color: var(--gold); color: var(--gold);
      background: rgba(200,152,60,0.08);
    }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* No logueado */
    .not-logged {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 16px; text-align: center;
    }
    .not-logged h2 { font-family: var(--ft); color: var(--gold); letter-spacing: 3px; }
    .not-logged p  { color: var(--dim); font-size: 13px; }
    .btn-login {
      display: inline-block;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .topbar { padding: 10px 14px; flex-wrap: wrap; }
      .topbar-logo { font-size: 13px; letter-spacing: 2px; }
      .topbar-logo-mark { width: 28px; height: 28px; }
      .topbar-nav { width: 100%; justify-content: center; gap: 14px; }
      .topbar-nav a { font-size: 10px; letter-spacing: 1.3px; }
      .edit-section { align-items: stretch; flex-direction: column; }
      .avatar-picker, .photo-tools { width: 100%; }
      .photo-upload, .btn-save, .edit-select { width: 100%; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .friends-form { flex-direction: column; }
      .danger-form { grid-template-columns: 1fr; }
      .match-row { gap: 10px; padding: 12px; }
      .match-result-badge { width: 34px; height: 34px; font-size: 15px; border-radius: 8px; }
      .match-detail { white-space: nowrap; max-width: 100%; }
      .match-elo-change { font-size: 12px; min-width: 34px; }
      .match-date { display: none; }
      .profile-hero { padding: 28px 16px 24px; }
    }

    /* Pestanas de navegacion entre Perfil / Historial / Ajustes.
       Cada una es su propia pagina real (no anclas de una sola pagina
       larga), para que se sientan como destinos distintos. */
    .profile-tabs {
      display: flex;
      gap: 6px;
      padding: 12px 24px;
      background: rgba(13,11,8,0.9);
      border-bottom: 1px solid rgba(200,152,60,0.1);
      overflow-x: auto;
    }
    .profile-tab {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .profile-tab:hover { color: var(--gold); background: rgba(200,152,60,0.06); }
    .profile-tab.is-active { color: var(--carbon); background: var(--gold); }

    /* Selector Ajedrez / Damas -- cada juego tiene su propio ELO y
       estadisticas, este toggle cambia cual se muestra sin recargar. */
    .game-toggle {
      display: flex; gap: 6px;
      background: var(--surface);
      border: 1px solid rgba(200,152,60,0.14);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .game-toggle-btn {
      flex: 1;
      padding: 9px 12px;
      border: none; border-radius: 7px;
      background: transparent;
      color: var(--dim);
      font-family: var(--fb);
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .game-toggle-btn:hover { color: var(--gold); }
    .game-toggle-btn.is-active { background: var(--gold); color: var(--carbon); }
  </style>
</head>
<body>

  <!-- Topbar -->
  <nav class="topbar">
    <a href="/lobby.html" class="topbar-logo"><img class="topbar-logo-mark" src="/favicon.png?v=6" alt="">OZAMA CHESS</a>
    <div class="topbar-nav">
      <a href="/lobby.html">Lobby</a>
      <a href="/login.html" id="nav-logout" onclick="logout(); return false;">Cerrar sesion</a>
    </div>
  </nav>

  <div class="profile-tabs">
    <a href="/profile.html" class=" profile-tab is-active">Perfil</a>
    <a href="/history.html" class="profile-tab">Historial</a>
    <a href="/collection.html" class="profile-tab">Colección</a>
    <a href="/settings.html" class="profile-tab">Ajustes</a>
  </div>

  <!-- Contenido principal -->
  <div id="main-content"></div>

  <script>
    (async () => {
    await window.OZAMA_RUNTIME?.ready;
    const _user  = JSON.parse(localStorage.getItem('ozama-user') || 'null');
    const _token = window.OZAMA_RUNTIME?.getAuthToken?.() || '';
    let profileInitialized = false;
    let currentGame = 'chess';
    let currentUser = null;

        function getFlag(country) {
          if (!country || country === 'OTHER') return '<span class="country-code">--</span>';
          const code = String(country).trim().toLowerCase();
          if (!/^[a-z]{2}$/.test(code)) return '<span class="country-code">--</span>';
          return `<img src="https://flagcdn.com/32x24/${code}.png" alt="${code.toUpperCase()}" style="width:28px;height:20px;border-radius:2px;object-fit:cover;vertical-align:middle;" onerror="this.outerHTML='<span class=&quot;country-code&quot;>${code.toUpperCase()}</span>'"/>`;
        }

        function escapeHtml(value) {
          return String(value ?? '').replace(/[&<>"']/g, (char) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
          }[char]));
        }

        function avatarClass(avatar) {
          const index = Number.isFinite(Number(avatar)) ? Number(avatar) : 0;
          return `avatar-${Math.abs(index) % 6}`;
        }

        async function logout() {
          try {
            await fetch('/api/auth/logout', {
              method: 'POST',
              credentials: 'include',
              keepalive: true,
              headers: _token ? { Authorization: `Bearer ${_token}` } : {}
            });
          }
          catch (_) {}
          await window.OZAMA_RUNTIME?.clearAuthToken?.().catch(() => {});
          localStorage.removeItem('ozama-user');
          sessionStorage.clear();
          window.location.replace('/login.html');
        }

        function renderNotLogged() {
          document.getElementById('main-content').innerHTML = `
            <div class="not-logged oz-card oz-enter" style="--d:1">
              <div style="font-family:var(--ft);font-size:34px;color:var(--gold);letter-spacing:4px;">OC</div>
              <h2>ACCESO REQUERIDO</h2>
              <p>Necesitas una cuenta para ver tu perfil.</p>
              <a href="/login.html" class="btn-login btn-primary">Iniciar sesion</a>
            </div>
          `;
        }

    function statCardsHtml(game, user) {
      const stats = (game === 'damas' ? user.damasStats : user.stats) || { wins: 0, losses: 0, draws: 0, streak: 0, bestStreak: 0 };
      const wins = stats.wins || 0, losses = stats.losses || 0, draws = stats.draws || 0;
      const gamesPlayed = wins + losses + draws;
      const winRate = gamesPlayed > 0 ? Math.round(wins / gamesPlayed * 100) : 0;
      return `
        <div class="stat-card oz-card wins">
          <div class="stat-value">${wins}</div>
          <div class="stat-label">Victorias</div>
        </div>
        <div class="stat-card oz-card losses">
          <div class="stat-value">${losses}</div>
          <div class="stat-label">Derrotas</div>
        </div>
        <div class="stat-card oz-card draws">
          <div class="stat-value">${draws}</div>
          <div class="stat-label">Tablas</div>
        </div>
        <div class="stat-card oz-card">
          <div class="stat-value">${winRate}%</div>
          <div class="stat-label">% Victorias</div>
        </div>
        <div class="stat-card oz-card">
          <div class="stat-value">${stats.streak || 0}</div>
          <div class="stat-label">Racha actual</div>
        </div>
        <div class="stat-card oz-card">
          <div class="stat-value">${stats.bestStreak || 0}</div>
          <div class="stat-label">Mejor racha</div>
        </div>
      `;
    }

    function heroEloValue(game, user) {
      return (game === 'damas' ? user.damasElo : user.elo) || 1200;
    }

    function switchGame(game) {
      currentGame = game;
      document.querySelectorAll('.game-toggle-btn').forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.game === game);
      });
      if (!currentUser) return;
      const eloEl = document.getElementById('hero-elo');
      if (eloEl) eloEl.textContent = `ELO ${heroEloValue(game, currentUser)}`;
      const grid = document.getElementById('estadisticas');
      if (grid) grid.innerHTML = statCardsHtml(game, currentUser);
      loadAdvancedStats(game);
      renderIdentityPanel(game);
      loadEloHistory(game);
    }

    function formatDuration(seconds) {
      if (!seconds) return null;
      const m = Math.round(seconds / 60);
      if (m < 1) return '<1 min';
      if (m < 60) return `${m} min`;
      const h = Math.floor(m / 60);
      const rem = m % 60;
      return `${h}h ${rem}min`;
    }

    let _identityData = null;
    async function loadIdentityStats() {
      try {
        const res = await fetch('/api/user/profile-stats', { headers: { Authorization: `Bearer ${_token}` }, cache: 'no-store' });
        if (!res.ok) throw new Error();
        _identityData = await res.json();
      } catch (_) {
        _identityData = null;
      }
      renderIdentityPanel(currentGame);
      renderLevelPanel();
      loadEloHistory(currentGame);
    }

    function eloChartSvg(history) {
      if (!history.length) return null;
      const elos = history.map((h) => h.elo);
      const min = Math.min(...elos), max = Math.max(...elos);
      const range = Math.max(1, max - min);
      const w = 300, h = 74, pad = 6;
      const pts = history.map((entry, i) => {
        const x = history.length === 1 ? w / 2 : pad + (i / (history.length - 1)) * (w - pad * 2);
        const y = pad + (1 - (entry.elo - min) / range) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const last = history[history.length - 1];
      const lastX = pts[pts.length - 1].split(',')[0];
      const lastY = pts[pts.length - 1].split(',')[1];
      const areaPts = `${pad},${h - pad} ${pts.join(' ')} ${w - pad},${h - pad}`;
      return `
        <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <polygon points="${areaPts}" fill="rgba(200,152,60,0.12)" />
          <polyline points="${pts.join(' ')}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
          <circle cx="${lastX}" cy="${lastY}" r="3.2" fill="var(--gold)" />
        </svg>
      `;
    }

    async function loadEloHistory(game) {
      const wrap = document.getElementById('elo-chart-wrap');
      if (!wrap) return;
      wrap.innerHTML = '<div class="elo-chart-empty">Cargando...</div>';
      try {
        const res = await fetch(`/api/user/elo-history?game=${game}`, { headers: { Authorization: `Bearer ${_token}` }, cache: 'no-store' });
        if (!res.ok) throw new Error();
        const data = await res.json();
        const history = data.history || [];
        if (history.length < 2) {
          wrap.innerHTML = '<div class="elo-chart-empty">Juega más partidas para ver tu progreso de ELO en un gráfico.</div>';
          return;
        }
        const svg = eloChartSvg(history);
        const first = history[0].elo, last = history[history.length - 1].elo;
        const diff = last - first;
        wrap.innerHTML = `
          ${svg}
          <div class="elo-chart-summary">
            <span>Últimas ${history.length} partidas</span>
            <span>${diff >= 0 ? '+' : ''}${diff} ELO · <strong>${last}</strong> actual</span>
          </div>
        `;
      } catch (_) {
        wrap.innerHTML = '<div class="elo-chart-empty">No se pudo cargar.</div>';
      }
    }

    function renderLevelPanel() {
      const body = document.getElementById('level-body');
      if (!body) return;
      const data = _identityData;
      if (!data) { body.innerHTML = '<div class="empty-msg">No se pudo cargar.</div>'; return; }
      const pct = Math.max(0, Math.min(100, data.xpIntoLevel));
      body.innerHTML = `
        <div class="level-row">
          <div class="level-badge"><span class="lv-num">${data.level}</span><span class="lv-lbl">NIVEL</span></div>
          <div class="level-info">
            <div class="level-xp-text" style="color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:11px;">${escapeHtml(data.globalTitle || 'Novato')}</div>
            <div class="level-xp-text">${data.xp} XP total · ${data.xpIntoLevel}/100 para el nivel ${data.level + 1} · ${data.achievementsUnlocked}/${data.achievementsTotal} logros</div>
            <div class="xp-bar-track"><div class="xp-bar-fill" style="width:${pct}%"></div></div>
          </div>
        </div>
      `;
    }

    async function loadAchievements() {
      const grid = document.getElementById('achievements-grid');
      if (!grid) return;
      try {
        const res = await fetch('/api/user/achievements', { headers: { Authorization: `Bearer ${_token}` }, cache: 'no-store' });
        if (!res.ok) throw new Error();
        const data = await res.json();
        grid.innerHTML = (data.achievements || []).map((a) => `
          <div class="achievement-badge ${a.unlocked ? 'is-unlocked' : ''}" title="${a.unlocked ? 'Desbloqueado' : 'Bloqueado'}">
            <span class="achievement-icon">${a.icon}</span>
            <span class="achievement-name">${escapeHtml(a.name)}</span>
            <span class="achievement-desc">${escapeHtml(a.description)}</span>
          </div>
        `).join('');
      } catch (_) {
        grid.innerHTML = '<div class="empty-msg">No se pudieron cargar los logros.</div>';
      }
    }

    function favoriteModeLabel(data) {
      if (!data || !data.totalGames) return 'Sin datos suficientes';
      if (data.favoriteMode === 'chess') return 'Ajedrez';
      if (data.favoriteMode === 'damas') return 'Damas';
      return 'Parejo entre los dos';
    }

    function styleRow(name, value) {
      const hasValue = value !== null && value !== undefined;
      return `
        <div class="style-item">
          <span class="style-name">${escapeHtml(name)}</span>
          <span class="style-value ${hasValue ? '' : 'is-empty'}">${hasValue ? escapeHtml(String(value)) : 'Sin datos suficientes'}</span>
        </div>
      `;
    }

    function renderIdentityPanel(game) {
      const rankEl = document.getElementById('hero-rank');
      const body = document.getElementById('identity-body');
      const styleGrid = document.getElementById('style-grid');
      if (!body || !styleGrid) return;
      const data = _identityData;

      if (rankEl) rankEl.textContent = data ? (game === 'damas' ? data.damasRank : data.rank) : '';

      if (!data) {
        body.innerHTML = '<div class="empty-msg">No se pudieron cargar los datos.</div>';
        styleGrid.innerHTML = '';
        return;
      }

      const totalTime = formatDuration(data.totalTimePlayedSec) || 'Sin datos suficientes';
      body.innerHTML = `
        <div class="identity-row">
          <div class="identity-item"><div class="identity-value">${game === 'damas' ? data.damasRank : data.rank}</div><div class="identity-label">Rango</div></div>
          <div class="identity-item"><div class="identity-value">${data.totalGames}</div><div class="identity-label">Partidas totales</div></div>
          <div class="identity-item"><div class="identity-value">${totalTime}</div><div class="identity-label">Tiempo jugado</div></div>
          <div class="identity-item"><div class="identity-value">${favoriteModeLabel(data)}</div><div class="identity-label">Modalidad favorita</div></div>
        </div>
      `;

      styleGrid.innerHTML = [
        styleRow('Promedio de movimientos por partida', data.style.avgMovesPerGame),
        styleRow('Agresividad', data.style.aggressiveness),
        styleRow('Rendimiento en finales', data.style.endgamePerformance),
        styleRow('Rendimiento con poco tiempo', data.style.timePressurePerformance),
      ].join('');
    }

    async function loadAdvancedStats(game) {
      const body = document.getElementById('adv-stats-body');
      if (!body || !currentUser) return;

      const premiumUntil = currentUser.premiumUntil ? new Date(currentUser.premiumUntil) : null;
      const premiumActive = currentUser.plan === 'premium' && (!premiumUntil || premiumUntil > new Date());
      if (!premiumActive) {
        body.innerHTML = `
          <div class="adv-locked">
            <div>Desbloquea tu color con mas victorias, duracion promedio de partida y tus aperturas mas jugadas.</div>
            <a href="/settings.html#premium-panel">Activar OZAMA Premium →</a>
          </div>
        `;
        return;
      }

      body.innerHTML = '<div class="empty-msg">Cargando...</div>';
      try {
        const res = await fetch(`/api/user/stats/advanced?game=${game}`, {
          headers: { Authorization: `Bearer ${_token}` },
          cache: 'no-store',
        });
        if (!res.ok) throw new Error();
        const data = await res.json();

        if (!data.totalGames) {
          body.innerHTML = '<div class="empty-msg">Todavia no hay partidas terminadas para analizar.</div>';
          return;
        }

        const duration = formatDuration(data.avgDurationSec);
        const openingsHtml = (data.topOpenings || []).length
          ? data.topOpenings.map((o) => `
              <div class="adv-opening-row">
                <span>${escapeHtml(o.name)}</span>
                <span class="adv-opening-count">${o.count}</span>
              </div>
            `).join('')
          : '';

        const winReasonsHtml = data.winReasons
          ? data.winReasons.map((r) => {
              const pct = data.totalWins ? Math.round((r.count / data.totalWins) * 100) : 0;
              return `
                <div class="adv-opening-row">
                  <span>${escapeHtml(r.label)}</span>
                  <span class="adv-opening-count">${r.count} (${pct}%)</span>
                </div>
              `;
            }).join('')
          : `<div class="empty-msg" style="padding:8px 0;">Necesitamos más partidas para calcular esta estadística.</div>`;

        body.innerHTML = `
          <div class="adv-color-grid">
            <div class="adv-color-card">
              <div class="adv-color-label">Con Blancas</div>
              <div class="adv-color-rate">${data.asWhite.winRate}%</div>
              <div class="adv-color-detail">${data.asWhite.wins}V / ${data.asWhite.losses}D / ${data.asWhite.draws}T</div>
            </div>
            <div class="adv-color-card">
              <div class="adv-color-label">Con Negras</div>
              <div class="adv-color-rate">${data.asBlack.winRate}%</div>
              <div class="adv-color-detail">${data.asBlack.wins}V / ${data.asBlack.losses}D / ${data.asBlack.draws}T</div>
            </div>
          </div>
          ${duration ? `<div class="adv-duration">Duracion promedio de partida: <strong>${duration}</strong></div>` : ''}
          ${openingsHtml ? `<div class="adv-openings-title">Aperturas mas jugadas (con Blancas)</div>${openingsHtml}` : ''}
          <div class="adv-openings-title">Cómo ganas tus partidas</div>
          ${winReasonsHtml}
        `;
      } catch (_) {
        body.innerHTML = '<div class="empty-msg">No se pudieron cargar las estadisticas avanzadas.</div>';
      }
    }

    function renderProfile(user) {
      user.stats = user.stats || { wins: 0, losses: 0, draws: 0 };
      user.damasStats = user.damasStats || { wins: 0, losses: 0, draws: 0 };
      currentUser = user;
      const avatar = Math.abs(Number(user.avatar) || 0) % 6;
      const initial = escapeHtml((user.username || '?')[0].toUpperCase());
      const username = escapeHtml(user.username || 'Jugador');
      const avatarImage = user.avatarImage || '';
      const premiumUntil = user.premiumUntil ? new Date(user.premiumUntil) : null;
      const premiumActive = user.plan === 'premium' && (!premiumUntil || premiumUntil > new Date());
      const planLabel = premiumActive ? 'Premium' : 'Free';
      const ringClass = `avatar-ring${premiumActive ? ' premium' : ''}`;
      const frameAttr = `data-frame="${escapeHtml(user.equippedFrame || 'ninguno')}"`;
      const heroAvatar = avatarImage
        ? `<div class="${ringClass}" id="avatar-ring" data-initial="${initial}" ${frameAttr}><img src="${escapeHtml(avatarImage)}" alt=""></div>`
        : `<div class="${ringClass} ${avatarClass(avatar)}" id="avatar-ring" data-initial="${initial}" ${frameAttr}>${initial}</div>`;

      document.getElementById('main-content').innerHTML = `
        <!-- Hero -->
                <div class="profile-hero oz-enter" id="perfil" style="--d:0">
                  ${heroAvatar}
                  <div class="profile-name">${username}</div>
                  <div class="profile-meta">
                    <span class="profile-country">${getFlag(user.country)}</span>
                    <span>${user.country || 'DO'}</span>
                  </div>
                  <div class="elo-display" id="hero-elo">ELO ${heroEloValue(currentGame, user)}</div>
                  <div class="rank-badge" id="hero-rank"></div>
                  <div class="plan-badge ${premiumActive ? 'premium' : ''}">${planLabel}</div>
                </div>

        <div class="container">

          <div class="game-toggle oz-enter" style="--d:0">
            <button class="game-toggle-btn ${currentGame === 'chess' ? 'is-active' : ''}" data-game="chess" onclick="switchGame('chess')">Ajedrez</button>
            <button class="game-toggle-btn ${currentGame === 'damas' ? 'is-active' : ''}" data-game="damas" onclick="switchGame('damas')">Damas</button>
          </div>

          <!-- Stats -->
                  <div class="stats-grid oz-enter" id="estadisticas" style="--d:1">${statCardsHtml(currentGame, user)}</div>

                  <div class="identity-panel oz-card oz-enter" id="identity-panel" style="--d:2">
                    <div class="section-title">Tarjeta de identidad</div>
                    <div id="identity-body"><div class="empty-msg">Cargando...</div></div>
                    <div class="style-title" style="border-top:none;padding-top:0;">Progreso de ELO</div>
                    <div id="elo-chart-wrap"><div class="empty-msg">Cargando...</div></div>
                    <div class="style-title">Mi estilo de juego</div>
                    <div class="style-grid" id="style-grid"></div>
                  </div>

                  <div class="progression-panel oz-card oz-enter" id="progression-panel" style="--d:2">
                    <div class="section-title">Progresión</div>
                    <div id="level-body"><div class="empty-msg">Cargando...</div></div>
                    <div class="achievements-title" id="achievements-title">Logros</div>
                    <div class="achievements-grid" id="achievements-grid"></div>
                  </div>

                  <div class="adv-stats-panel oz-card oz-enter" id="adv-stats-panel" style="--d:3">
                    <div class="adv-stats-title">
                      <div class="section-title">Estadisticas avanzadas</div>
                      <span class="adv-pro-tag">PREMIUM</span>
                    </div>
                    <div id="adv-stats-body"><div class="empty-msg">Cargando...</div></div>
                  </div>

                  <div class="friends-panel oz-card oz-enter" id="amigos" style="--d:6">
                    <div class="section-title">Amigos</div>
                    <div class="friends-form">
                      <input class="friends-input" id="friend-username" maxlength="20" placeholder="Nombre de usuario">
                      <button class="btn-save btn-primary" onclick="addFriend()">Agregar</button>
                    </div>
                    <div class="friends-list" id="friends-list">
                      <div class="empty-msg">Cargando amigos...</div>
                    </div>
                  </div>

        </div>
      `;
    }

    function renderFriends(friends = []) {
      const list = document.getElementById('friends-list');
      if (!list) return;
      if (!friends.length) {
        list.innerHTML = '<div class="empty-msg">Todavia no has agregado amigos.</div>';
        return;
      }
      list.innerHTML = friends.map((friend) => {
        const name = escapeHtml(friend.username || 'Jugador');
        const initial = escapeHtml((friend.username || '?')[0].toUpperCase());
        const img = friend.avatarImage
          ? `<img src="${escapeHtml(friend.avatarImage)}" alt="">`
          : initial;
        const games = (friend.stats?.wins || 0) + (friend.stats?.losses || 0) + (friend.stats?.draws || 0);
        return `
          <div class="friend-row">
            <div class="friend-avatar ${avatarClass(friend.avatar)}">${img}</div>
            <div class="friend-main">
              <div class="friend-name">${getFlag(friend.country)} ${name}</div>
              <div class="friend-meta">ELO ${friend.elo || 1200} · ${games} partidas</div>
            </div>
            <a class="page-btn" href="/lobby.html?challenge=${encodeURIComponent(friend.username || '')}">Desafiar</a>
            <button class="page-btn" onclick="removeFriend('${name}')">Quitar</button>
          </div>
        `;
      }).join('');
    }

    async function loadFriends() {
      const list = document.getElementById('friends-list');
      if (!list) return;
      try {
        const res = await fetch('/api/user/friends', {
          headers: { Authorization: `Bearer ${_token}` }
        });
        if (!res.ok) throw new Error();
        const data = await res.json();
        renderFriends(data.friends || []);
      } catch (err) {
        list.innerHTML = '<div class="empty-msg">No se pudieron cargar los amigos.</div>';
      }
    }

    async function addFriend() {
      const input = document.getElementById('friend-username');
      const username = input?.value.trim();
      if (!username) return;
      try {
        const res = await fetch(`/api/user/friends/${encodeURIComponent(username)}`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${_token}` }
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'No se pudo agregar.');
        input.value = '';
        await loadFriends();
      } catch (err) {
        alert(err.message || 'No se pudo agregar.');
      }
    }

    async function removeFriend(username) {
      try {
        const res = await fetch(`/api/user/friends/${encodeURIComponent(username)}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${_token}` }
        });
        if (!res.ok) throw new Error();
        await loadFriends();
      } catch (err) {
        alert('No se pudo quitar el amigo.');
      }
    }

    async function refreshProfile() {
      try {
        const res = await fetch('/api/user/me', { headers: { Authorization: `Bearer ${_token}` }, cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        localStorage.setItem('ozama-user', JSON.stringify(data.user));
        renderProfile(data.user);
        loadFriends();
        loadAdvancedStats(currentGame);
        loadIdentityStats();
        loadAchievements();
      } catch (_) {}
    }

    async function init() {
      if (!_user || (window.OZAMA_RUNTIME?.native && !_token)) { renderNotLogged(); return; }
      document.getElementById('main-content').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Cargando perfil...
        </div>
      `;
      try {
        const res = await fetch('/api/user/me', { headers: { Authorization: `Bearer ${_token}` }, cache: 'no-store' });
        if (!res.ok) { renderNotLogged(); return; }
        const data = await res.json();
        localStorage.setItem('ozama-user', JSON.stringify(data.user));
        renderProfile(data.user);
        profileInitialized = true;
        loadFriends();
        loadAdvancedStats(currentGame);
        loadIdentityStats();
        loadAchievements();
      } catch (err) {
        document.getElementById('main-content').innerHTML =
          '<div class="loading">Error cargando el perfil. Recarga la pagina.</div>';
      }
    }

    init();
    function refreshVisibleProfile() {
      if (!profileInitialized) return;
      const active = document.activeElement;
      const editing = active && ['INPUT', 'SELECT', 'TEXTAREA'].includes(active.tagName);
      if (document.visibilityState === 'visible' && !editing) refreshProfile();
    }
    document.addEventListener('visibilitychange', refreshVisibleProfile);
    window.addEventListener('focus', refreshVisibleProfile);
    window.setInterval(refreshVisibleProfile, 30_000);
    Object.assign(window, {
      logout,
      addFriend,
      removeFriend,
      switchGame,
    });
    })();
  </script>
</body>
</html>
