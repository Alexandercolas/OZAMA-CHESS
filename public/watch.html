<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://flagcdn.com; media-src 'self'; connect-src 'self'">
  <meta name="theme-color" content="#0D0B08"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Partida compartida — OZAMA CHESS</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <script src="/preferences.js?v=20260831-fase25"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--carbon); color: var(--text); font-family: var(--fb); min-height: 100vh; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; background: rgba(13,11,8,0.97);
      border-bottom: 1px solid rgba(200,152,60,0.18);
    }
    .topbar a { color: var(--gold); font-family: var(--ft); font-weight: 900; letter-spacing: 3px; text-decoration: none; font-size: 15px; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 60px; }
    .eyebrow { font-family: var(--fm); font-size: 10.5px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; text-align: center; }
    h1 { font-family: var(--ft); font-size: 28px; text-align: center; margin: 8px 0 32px; color: var(--text); }
    .matchup { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 24px; }
    .side { text-align: center; }
    .side .av { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; margin: 0 auto 8px; background: linear-gradient(135deg, var(--gold), #8B6914); display: flex; align-items: center; justify-content: center; font-family: var(--ft); font-weight: 900; color: var(--carbon); font-size: 22px; }
    .side .av img { width: 100%; height: 100%; object-fit: cover; }
    .side .nm { font-weight: 700; font-size: 14px; }
    .side .cc { font-size: 11px; color: var(--dim); }
    .vs { font-family: var(--ft); color: var(--dim); font-size: 13px; }
    .result-card { background: var(--s1); border: 1px solid rgba(200,152,60,0.18); border-radius: 10px; padding: 18px; text-align: center; margin-bottom: 24px; }
    .result-title { font-family: var(--ft); font-size: 20px; color: var(--gold); font-weight: 700; }
    .result-meta { font-size: 12px; color: var(--dim); margin-top: 6px; letter-spacing: 0.5px; }
    .pgn-box { background: var(--s2); border: 1px solid rgba(200,152,60,0.12); border-radius: 8px; padding: 16px; }
    .pgn-title { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; }
    .pgn-text { font-family: var(--fm); font-size: 12px; color: var(--text); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow-y: auto; line-height: 1.6; }
    .pgn-empty { color: var(--dim); font-size: 12px; font-style: italic; }
    .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .btn-watch { flex: 1; min-width: 140px; padding: 11px; border-radius: 8px; border: 1px solid rgba(200,152,60,0.3); background: rgba(200,152,60,0.08); color: var(--gold); font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-decoration: none; text-align: center; }
    .btn-watch:hover { border-color: var(--gold); }
    .cta { text-align: center; margin-top: 32px; }
    .cta a { color: var(--gold); text-decoration: none; font-weight: 700; }
    .loading, .error-msg { text-align: center; padding: 60px 20px; color: var(--dim); }
  </style>
</head>
<body>
  <nav class="topbar"><a href="/">OZAMA CHESS</a></nav>
  <div class="wrap" id="content">
    <div class="loading">Cargando partida...</div>
  </div>

  <script>
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
    }
    function flagUrl(country) {
      const code = String(country || 'DO').toLowerCase();
      return /^[a-z]{2}$/.test(code) ? `https://flagcdn.com/24x18/${code}.png` : '';
    }
    function avatarHtml(p) {
      if (p.avatarImage) return `<img src="${escapeHtml(p.avatarImage)}" alt="">`;
      return escapeHtml((p.name || '?').charAt(0).toUpperCase());
    }
    function resultLine(match) {
      if (match.result === 'draw') return 'Tablas';
      const winnerName = match.winner === 'w' ? match.white.name : match.black.name;
      return `Ganó ${escapeHtml(winnerName)}`;
    }

    async function load() {
      const id = new URLSearchParams(window.location.search).get('id');
      const content = document.getElementById('content');
      if (!id) { content.innerHTML = '<div class="error-msg">Falta el link de la partida.</div>'; return; }
      try {
        const res = await fetch(`/api/matches/${id}/public`);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'No se pudo cargar la partida.');
        render(data.match);
      } catch (err) {
        content.innerHTML = `<div class="error-msg">${escapeHtml(err.message || 'No se pudo cargar la partida.')}</div>`;
      }
    }

    function render(match) {
      const date = match.endedAt ? new Date(match.endedAt).toLocaleDateString('es-DO', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
      document.getElementById('content').innerHTML = `
        <div class="eyebrow">Partida compartida</div>
        <h1>OZAMA CHESS</h1>
        <div class="matchup">
          <div class="side">
            <div class="av">${avatarHtml(match.white)}</div>
            <div class="nm">${escapeHtml(match.white.name)}</div>
            <div class="cc">${match.white.country || ''}</div>
          </div>
          <div class="vs">vs</div>
          <div class="side">
            <div class="av">${avatarHtml(match.black)}</div>
            <div class="nm">${escapeHtml(match.black.name)}</div>
            <div class="cc">${match.black.country || ''}</div>
          </div>
        </div>
        <div class="result-card">
          <div class="result-title">${resultLine(match)}</div>
          <div class="result-meta">${match.movesCount} jugadas · ${escapeHtml(date)}</div>
        </div>
        <div class="pgn-box">
          <div class="pgn-title">Notación (PGN)</div>
          ${match.pgn
            ? `<div class="pgn-text">${escapeHtml(match.pgn)}</div>`
            : '<div class="pgn-empty">La notación de esta partida no quedó guardada.</div>'}
          ${match.pgn ? `<div class="actions"><button class="btn-watch" onclick="downloadPgn()">⬇ Descargar PGN</button></div>` : ''}
        </div>
        <div class="cta">¿Quieres jugar tu propia partida? <a href="/lobby.html">Entra a OZAMA CHESS →</a></div>
      `;
      window._matchPgn = match.pgn || '';
    }

    function downloadPgn() {
      const blob = new Blob([window._matchPgn], { type: 'application/x-chess-pgn' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'ozama-chess-compartida.pgn';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    window.downloadPgn = downloadPgn;
    load();
  </script>
</body>
</html>
