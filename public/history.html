<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>OZAMA CHESS - Historial</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png?v=5">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=5">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <script src="/preferences.js?v=20260831-fase25"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: var(--carbon);
      --surface: var(--s1);
      --surface2: var(--s2);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--fb);
      min-height: 100vh;
      padding: 0 0 60px;
      overflow-x: hidden;
    }

    /* Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 24px;
      background: rgba(13,11,8,0.97);
      border-bottom: 1px solid rgba(200,152,60,0.18);
      gap: 12px;
      min-width: 0;
    }

    .topbar-logo {
      font-family: var(--ft);
      font-size: 16px; font-weight: 900;
      color: var(--gold); letter-spacing: 4px;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 10px;
      min-width: 0;
    }
    .topbar-logo-mark {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid rgba(200,152,60,0.48);
      box-shadow: 0 0 14px rgba(200,152,60,0.22);
    }

    .topbar-nav { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 16px; }
    .topbar-nav a {
      color: var(--dim); text-decoration: none;
      font-size: 11px; font-weight: 600; letter-spacing: 2px;
      transition: color 0.2s;
    }
    .topbar-nav a:hover { color: var(--gold); }

    /* Hero del perfil */
    .profile-hero {
      background: linear-gradient(160deg, var(--s2) 0%, var(--s1) 100%);
      border-bottom: 1px solid rgba(200,152,60,0.16);
      padding: 40px 24px 32px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }

    .avatar-ring {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #8B6914);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--ft);
      font-size: 36px; font-weight: 900; color: var(--carbon);
      box-shadow: 0 0 30px rgba(200,152,60,0.3);
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar-ring img,
    .avatar-choice img,
    .friend-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar-0 { background: linear-gradient(135deg, var(--blue-do), var(--gold)); }
    .avatar-1 { background: linear-gradient(135deg, var(--red-do), var(--gold)); }
    .avatar-2 { background: linear-gradient(135deg, #226F54, var(--gold)); }
    .avatar-3 { background: linear-gradient(135deg, #5B2A86, var(--gold)); }
    .avatar-4 { background: linear-gradient(135deg, #0F766E, var(--gold)); }
    .avatar-5 { background: linear-gradient(135deg, var(--teja), var(--gold)); }

    .profile-name {
      font-family: var(--ft);
      font-size: 24px; font-weight: 700; color: var(--gold);
      letter-spacing: 2px;
    }

    .profile-meta {
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; color: var(--dim);
    }

    .profile-country { font-size: 20px; }
    .country-code {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 28px; height: 20px;
      border: 1px solid rgba(200,152,60,0.18);
      color: var(--gold);
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      background: rgba(200,152,60,0.06);
    }

    .elo-display {
      background: rgba(200,152,60,0.1);
      border: 1px solid rgba(200,152,60,0.3);
      border-radius: 20px; padding: 6px 18px;
      font-family: var(--ft);
      font-size: 14px; font-weight: 700; color: var(--gold);
      letter-spacing: 2px;
    }

    .plan-badge {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 14px;
      border: 1px solid rgba(200,152,60,0.24);
      background: rgba(200,152,60,0.06);
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .plan-badge.premium {
      color: var(--gold);
      border-color: rgba(200,152,60,0.44);
      box-shadow: 0 0 18px rgba(200,152,60,0.16);
    }

    /* Stats grid */
    .container { max-width: 800px; margin: 0 auto; padding: 28px 20px 0; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      padding: 18px 14px;
      text-align: center;
    }

    .stat-value {
      font-family: var(--ft);
      font-size: 28px; font-weight: 900; color: var(--gold);
      line-height: 1;
    }

    .stat-label {
      font-size: 10px; font-weight: 600;
      letter-spacing: 2px; color: var(--dim);
      text-transform: uppercase; margin-top: 6px;
    }

    .stat-card.wins   .stat-value { color: #2ecc71; }
    .stat-card.losses .stat-value { color: var(--danger); }
    .stat-card.draws  .stat-value { color: var(--dim); }

    /* Seccion historial */
    .section-title {
      font-family: var(--ft);
      font-size: 13px; font-weight: 700;
      color: var(--gold); letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(200,152,60,0.1);
    }

    /* Lista de partidas */
    .match-list { display: flex; flex-direction: column; gap: 8px; }

    .match-row {
      background: var(--surface);
      border: 1px solid rgba(200,152,60,0.08);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 14px;
      transition: border-color 0.2s;
    }
    .match-row:hover { border-color: rgba(200,152,60,0.2); }

    .match-result-badge {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .badge-win  { background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.3); }
    .badge-loss { background: rgba(231,76,60,0.15);  border: 1px solid rgba(231,76,60,0.3); }
    .badge-draw { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); }

    .match-info { flex: 1; min-width: 0; }

    .match-vs {
      font-size: 14px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .match-detail {
      font-size: 11px; color: var(--dim);
      letter-spacing: 1px; margin-top: 3px;
      overflow: hidden; text-overflow: ellipsis;
    }

    .match-elo-change {
      font-size: 13px; font-weight: 700;
      letter-spacing: 1px; flex-shrink: 0;
      text-align: right;
    }
    .elo-up   { color: #2ecc71; }
    .elo-down { color: #e74c3c; }
    .elo-flat { color: var(--dim); }

    .match-date {
      font-size: 10px; color: var(--dim);
      letter-spacing: 1px; flex-shrink: 0;
      text-align: right; min-width: 60px;
    }

    .match-share-btn {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 6px;
      background: transparent; border: 1px solid rgba(200,152,60,0.18);
      color: var(--dim); font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .match-share-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* Loading / empty */
    .loading {
      text-align: center; padding: 40px 20px;
      color: var(--dim); font-size: 13px; letter-spacing: 2px;
    }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(200,152,60,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-msg {
      text-align: center; padding: 32px 20px;
      color: var(--dim); font-size: 12px; letter-spacing: 2px;
    }

    /* Edit pais */
    .edit-section {
      padding: 20px;
      margin-bottom: 28px;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }

    .edit-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 2px; color: var(--dim);
      text-transform: uppercase; flex-shrink: 0;
    }

    .avatar-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .avatar-choice {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(200,152,60,0.25);
      color: white;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .avatar-choice:hover,
    .avatar-choice.active {
      transform: translateY(-1px);
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(200,152,60,0.25);
    }

    .edit-select {
      flex: 1; min-width: 160px;
      padding: 8px 12px;
      background: var(--surface2);
      border: 1px solid rgba(200,152,60,0.2);
      border-radius: 8px; color: var(--text);
      font-family: var(--fb);
      font-size: 14px; outline: none; cursor: pointer;
      appearance: none;
    }
    .edit-select:focus { border-color: var(--gold); }
    .edit-select option { background: var(--s2); }

    .btn-save {
      padding: 11px 22px;
      font-size: 11px;
      letter-spacing: 2px;
    }
    .btn-save.secondary {
      color: rgba(233,228,218,0.52);
    }

    .photo-upload {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 8px 12px;
      border: 1px solid rgba(200,152,60,0.25);
      border-radius: 8px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      background: rgba(200,152,60,0.06);
    }
    .photo-upload:hover {
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(200,152,60,0.18);
    }
    .photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .photo-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .photo-hint {
      width: 100%;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 1px;
    }
    .photo-status {
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .friends-panel {
      padding: 18px;
      margin-bottom: 28px;
    }
    .friends-form {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .friends-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      background: var(--surface2);
      border: 1px solid rgba(200,152,60,0.18);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--fb);
      outline: none;
    }
    .friends-input:focus { border-color: var(--gold); }
    .friends-list { display: grid; gap: 8px; }
    .friend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid rgba(200,152,60,0.08);
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
    }
    .friend-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-family: var(--ft);
      font-weight: 900;
      color: #080808;
      background: linear-gradient(135deg, var(--gold), #8B6914);
    }
    .friend-main { flex: 1; min-width: 0; }
    .friend-name { font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .friend-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }

    .account-panel {
      margin-bottom: 28px;
      padding: 20px;
    }
    .account-links { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 16px; }
    .account-links a {
      padding: 8px 11px;
      border: 1px solid rgba(200,152,60,0.17);
      border-radius: 4px;
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-decoration: none;
      text-transform: uppercase;
    }
    .account-links a:hover { border-color: var(--gold); color: var(--gold); }
    .danger-zone { border-top: 1px solid rgba(203,72,58,0.26); padding-top: 14px; }
    .danger-zone summary {
      color: #d98275;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .danger-copy { margin: 13px 0; color: var(--dim); font-size: 12px; line-height: 1.55; }
    .danger-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 9px; }
    .danger-form input {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid rgba(203,72,58,0.28);
      border-radius: 4px;
      outline: 0;
      color: var(--text);
      background: rgba(0,0,0,0.28);
    }
    .danger-form input:focus { border-color: #d98275; }
    .btn-delete {
      padding: 10px 15px;
      border: 1px solid rgba(203,72,58,0.62);
      border-radius: 4px;
      color: #f1d8d3;
      background: rgba(139,35,27,0.24);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn-delete:disabled { opacity: 0.45; cursor: wait; }
    .delete-status { min-height: 18px; margin-top: 9px; color: #d98275; font-size: 11px; }

    .save-msg {
      font-size: 11px; color: #2ecc71;
      letter-spacing: 1px; display: none;
    }

    .plan-note {
      width: 100%;
      padding-top: 12px;
      border-top: 1px solid rgba(200,152,60,0.08);
      color: var(--dim);
      font-size: 12px;
      line-height: 1.55;
    }

    .plan-note strong { color: var(--gold); font-family: var(--ft); letter-spacing: 1px; }

    /* Paginacion */
    .pagination {
      display: flex; justify-content: center; gap: 8px; margin-top: 20px;
    }

    .page-btn {
      padding: 7px 14px;
      background: var(--surface);
      border: 1px solid rgba(200,152,60,0.15);
      border-radius: 8px; color: var(--dim);
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .page-btn:hover, .page-btn.active {
      border-color: var(--gold); color: var(--gold);
      background: rgba(200,152,60,0.08);
    }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* No logueado */
    .not-logged {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 16px; text-align: center;
    }
    .not-logged h2 { font-family: var(--ft); color: var(--gold); letter-spacing: 3px; }
    .not-logged p  { color: var(--dim); font-size: 13px; }
    .btn-login {
      display: inline-block;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .topbar { padding: 10px 14px; flex-wrap: wrap; }
      .topbar-logo { font-size: 13px; letter-spacing: 2px; }
      .topbar-logo-mark { width: 28px; height: 28px; }
      .topbar-nav { width: 100%; justify-content: center; gap: 14px; }
      .topbar-nav a { font-size: 10px; letter-spacing: 1.3px; }
      .edit-section { align-items: stretch; flex-direction: column; }
      .avatar-picker, .photo-tools { width: 100%; }
      .photo-upload, .btn-save, .edit-select { width: 100%; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .friends-form { flex-direction: column; }
      .danger-form { grid-template-columns: 1fr; }
      .match-row { gap: 10px; padding: 12px; }
      .match-result-badge { width: 34px; height: 34px; font-size: 15px; border-radius: 8px; }
      .match-detail { white-space: nowrap; max-width: 100%; }
      .match-elo-change { font-size: 12px; min-width: 34px; }
      .match-date { display: none; }
      .profile-hero { padding: 28px 16px 24px; }
    }

    /* Pestanas de navegacion entre Perfil / Historial / Ajustes.
       Cada una es su propia pagina real (no anclas de una sola pagina
       larga), para que se sientan como destinos distintos. */
    .profile-tabs {
      display: flex;
      gap: 6px;
      padding: 12px 24px;
      background: rgba(13,11,8,0.9);
      border-bottom: 1px solid rgba(200,152,60,0.1);
      overflow-x: auto;
    }
    .profile-tab {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .profile-tab:hover { color: var(--gold); background: rgba(200,152,60,0.06); }
    .profile-tab.is-active { color: var(--carbon); background: var(--gold); }

    /* Selector Ajedrez / Damas -- cada juego guarda su propio historial. */
    .game-toggle {
      display: flex; gap: 6px;
      background: var(--surface);
      border: 1px solid rgba(200,152,60,0.14);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .game-toggle-btn {
      flex: 1;
      padding: 9px 12px;
      border: none; border-radius: 7px;
      background: transparent;
      color: var(--dim);
      font-family: var(--fb);
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .game-toggle-btn:hover { color: var(--gold); }
    .game-toggle-btn.is-active { background: var(--gold); color: var(--carbon); }

    /* Filtros de historial: chips de resultado + busqueda de rival.
       Compactos a proposito -- una sola fila, sin paneles nuevos. */
    .history-filters {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 8px; margin-bottom: 16px;
    }
    .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-chip {
      padding: 7px 13px;
      border-radius: 20px;
      border: 1px solid rgba(200,152,60,0.18);
      background: transparent;
      color: var(--dim);
      font-family: var(--fb);
      font-size: 11px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .filter-chip:hover { border-color: var(--gold); color: var(--gold); }
    .filter-chip.is-active { background: var(--gold); border-color: var(--gold); color: var(--carbon); }
    .filter-search {
      flex: 1; min-width: 140px; max-width: 220px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid rgba(200,152,60,0.16);
      border-radius: 20px;
      color: var(--text);
      font-family: var(--fb);
      font-size: 12px; outline: none;
      transition: border-color 0.2s;
    }
    .filter-search:focus { border-color: var(--gold); }
    .filter-search::placeholder { color: rgba(233,228,218,0.35); }

    @media (max-width: 600px) {
      .history-filters { gap: 10px; }
      .filter-search { max-width: none; width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <nav class="topbar">
    <a href="/lobby.html" class="topbar-logo"><img class="topbar-logo-mark" src="/favicon.png?v=6" alt="">OZAMA CHESS</a>
    <div class="topbar-nav">
      <a href="/lobby.html">Lobby</a>
      <a href="/login.html" id="nav-logout" onclick="logout(); return false;">Cerrar sesion</a>
    </div>
  </nav>

  <div class="profile-tabs">
    <a href="/profile.html" class="profile-tab">Perfil</a>
    <a href="/history.html" class=" profile-tab is-active">Historial</a>
    <a href="/settings.html" class="profile-tab">Ajustes</a>
  </div>

  <!-- Contenido principal -->
  <div id="main-content"></div>

  <script>
    (async () => {
    await window.OZAMA_RUNTIME?.ready;
    const _user  = JSON.parse(localStorage.getItem('ozama-user') || 'null');
    const _token = window.OZAMA_RUNTIME?.getAuthToken?.() || '';
    let currentHistoryPage = 1;
    let historyBusy = false;
    let historyInitialized = false;
    let currentGame = 'chess';
    let currentResultFilter = 'all';
    let currentOpponentFilter = '';
    let opponentDebounceTimer = null;

    const RESULT_FILTERS = [
      { value: 'all',  label: 'Todas' },
      { value: 'win',  label: 'Victorias' },
      { value: 'loss', label: 'Derrotas' },
      { value: 'draw', label: 'Tablas' },
    ];

    const DAMAS_REASON_LABELS = {
      'no-pieces': 'Sin fichas',
      'no-moves': 'Sin movimientos',
      'resign': 'Rendicion',
      'opponent-left': 'Rival se fue',
      'admin-closed': 'Cerrado por admin',
      'draw': 'Tablas',
    };

        function getFlag(country) {
          if (!country || country === 'OTHER') return '<span class="country-code">--</span>';
          const code = String(country).trim().toLowerCase();
          if (!/^[a-z]{2}$/.test(code)) return '<span class="country-code">--</span>';
          return `<img src="https://flagcdn.com/32x24/${code}.png" alt="${code.toUpperCase()}" style="width:28px;height:20px;border-radius:2px;object-fit:cover;vertical-align:middle;" onerror="this.outerHTML='<span class=&quot;country-code&quot;>${code.toUpperCase()}</span>'"/>`;
        }

        function escapeHtml(value) {
          return String(value ?? '').replace(/[&<>"']/g, (char) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
          }[char]));
        }

        function formatDate(d) {
          if (!d) return '';
          const date = new Date(d);
          return date.toLocaleDateString('es-DO', { day:'2-digit', month:'short' });
        }

        async function logout() {
          try {
            await fetch('/api/auth/logout', {
              method: 'POST',
              credentials: 'include',
              keepalive: true,
              headers: _token ? { Authorization: `Bearer ${_token}` } : {}
            });
          }
          catch (_) {}
          await window.OZAMA_RUNTIME?.clearAuthToken?.().catch(() => {});
          localStorage.removeItem('ozama-user');
          sessionStorage.clear();
          window.location.replace('/login.html');
        }

        function renderNotLogged() {
          document.getElementById('main-content').innerHTML = `
            <div class="not-logged oz-card oz-enter" style="--d:1">
              <div style="font-family:var(--ft);font-size:34px;color:var(--gold);letter-spacing:4px;">OC</div>
              <h2>ACCESO REQUERIDO</h2>
              <p>Necesitas una cuenta para ver tu perfil.</p>
              <a href="/login.html" class="btn-login btn-primary">Iniciar sesion</a>
            </div>
          `;
        }

    function renderHistory(user, history, total, page, game) {
            const filtersActive = currentResultFilter !== 'all' || currentOpponentFilter !== '';
            const emptyText = filtersActive
              ? 'Sin partidas que coincidan con estos filtros'
              : 'Sin partidas registradas aun';
            const matchRows = history.length === 0 ?
               `<div class="empty-msg">${emptyText}</div>`
              : history.map(m => {
                  const isWhite = m.whitePlayer.userId === user._id || m.whitePlayer.userId === user.id;
                  const myColor = isWhite ? 'w' : 'b';
                  const rivalPlayer = isWhite ? m.blackPlayer : m.whitePlayer;
                  const rival   = escapeHtml(rivalPlayer.name || 'Desconocido');
                  const result  = m.result;
                  const movesCount = Array.isArray(m.moves) ? m.moves.length : 0;

                  let won, badge, icon, eloClass, eloText, resultText;
                  if (result === 'draw') {
                    won = null; badge = 'badge-draw'; icon = '=';
                    eloClass = 'elo-flat'; eloText = '+0'; resultText = 'Tablas';
                  } else if ((result === 'white_win' && myColor === 'w') || (result === 'black_win' && myColor === 'b')) {
                    won = true; badge = 'badge-win'; icon = 'W';
                    const change = myColor === 'w' ? m.eloChange.white : m.eloChange.black;
                    eloClass = 'elo-up'; eloText = change != null ? `+${change}` : '+'; resultText = 'Victoria';
                  } else {
                    won = false; badge = 'badge-loss'; icon = 'L';
                    const change = myColor === 'w' ? m.eloChange.white : m.eloChange.black;
                    eloClass = 'elo-down'; eloText = change != null ? `${change}` : '-'; resultText = result === 'abandoned' ? 'Abandono' : 'Derrota';
                  }

                  const extraDetail = game === 'damas'
                    ? (DAMAS_REASON_LABELS[m.reason] || '')
                    : `${movesCount} movidas`;
                  const detail = [resultText, myColor === 'w' ? 'Blancas' : 'Negras', extraDetail, `Sala ${m.roomCode || ''}`]
                    .filter(Boolean).join(' · ');

                  const matchId = m._id || m.id || '';
                  const shareBtn = (game === 'chess' && matchId)
                    ? `<button class="match-share-btn" title="Copiar link para compartir esta partida" aria-label="Copiar link para compartir esta partida" onclick="shareMatch('${matchId}', this)">🔗</button>`
                    : '';

                  return `
                    <div class="match-row">
                      <div class="match-result-badge ${badge}">${icon}</div>
                      <div class="match-info">
                        <div class="match-vs">${getFlag(rivalPlayer.country)} vs ${rival}</div>
                        <div class="match-detail">${detail}</div>
                      </div>
                      <div class="match-elo-change ${eloClass}">${eloText}</div>
                      <div class="match-date">${formatDate(m.createdAt)}</div>
                      ${shareBtn}
                    </div>
                  `;
                }).join('');

            const totalPages = Math.ceil(total / 10);
            const paginationHtml = totalPages > 1 ? `
              <div class="pagination">
                <button class="page-btn" onclick="loadPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}>Ant</button>
                <button class="page-btn active">${page} / ${totalPages}</button>
                <button class="page-btn" onclick="loadPage(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>Sig</button>
              </div>
            ` : '';

      document.getElementById('main-content').innerHTML = `
        <div class="container" style="padding-top:28px;">
                    <div class="game-toggle oz-enter" style="--d:7">
                      <button class="game-toggle-btn ${game === 'chess' ? 'is-active' : ''}" data-game="chess" onclick="switchGame('chess')">Ajedrez</button>
                      <button class="game-toggle-btn ${game === 'damas' ? 'is-active' : ''}" data-game="damas" onclick="switchGame('damas')">Damas</button>
                    </div>
                    <div class="section-title oz-enter" id="historial" style="--d:8">Historial de Partidas</div>
                    <div class="history-filters oz-enter" style="--d:8.5">
                      <div class="filter-chips" role="tablist" aria-label="Filtrar por resultado">
                        ${RESULT_FILTERS.map(f => `<button class="filter-chip ${currentResultFilter === f.value ? 'is-active' : ''}" onclick="setResultFilter('${f.value}')">${f.label}</button>`).join('')}
                      </div>
                      <input type="search" class="filter-search" placeholder="Buscar rival..." value="${escapeHtml(currentOpponentFilter)}" oninput="onOpponentInput(this.value)" />
                    </div>
                    <div class="match-list oz-enter" id="match-list" style="--d:9">${matchRows}</div>
                    ${paginationHtml}

        </div>
      `;
    }

    async function loadPage(page = 1) {
      if (historyBusy) return;
      historyBusy = true;
      currentHistoryPage = Math.max(1, Number(page) || 1);
      // Re-renderizar reemplaza el input de busqueda -- si el usuario
      // estaba escribiendo ahi, se restaura el foco despues para no
      // cortarle la escritura a mitad de palabra.
      const focusedSearch = document.activeElement?.classList?.contains('filter-search');
      const endpoint = currentGame === 'damas' ? '/api/user/damas-history' : '/api/user/history';
      try {
        const params = new URLSearchParams({ page: currentHistoryPage, limit: 10, result: currentResultFilter });
        if (currentOpponentFilter) params.set('opponent', currentOpponentFilter);
        const [histRes, userRes] = await Promise.all([
          fetch(`${endpoint}?${params}`, { headers: { Authorization: `Bearer ${_token}` }, cache: 'no-store' }),
          fetch('/api/user/me', { headers: { Authorization: `Bearer ${_token}` }, cache: 'no-store' }),
        ]);
        if (!histRes.ok || !userRes.ok) throw new Error();
        const data = await histRes.json();
        const userData = await userRes.json();
        localStorage.setItem('ozama-user', JSON.stringify(userData.user));
        renderHistory(userData.user, data.matches, data.total, currentHistoryPage, currentGame);
        historyInitialized = true;
        if (focusedSearch) {
          const input = document.querySelector('.filter-search');
          if (input) { input.focus(); const v = input.value; input.setSelectionRange(v.length, v.length); }
        }
      } catch (err) {
        const list = document.getElementById('match-list');
        if (list) list.innerHTML = '<div class="empty-msg">No se pudo cargar el historial.</div>';
        else document.getElementById('main-content').innerHTML = '<div class="loading">No se pudo cargar el historial. Recarga la pagina.</div>';
      } finally {
        historyBusy = false;
      }
    }

    function switchGame(game) {
      if (currentGame === game || historyBusy) return;
      currentGame = game;
      loadPage(1);
    }

    function setResultFilter(value) {
      if (currentResultFilter === value || historyBusy) return;
      currentResultFilter = value;
      loadPage(1);
    }

    function onOpponentInput(value) {
      currentOpponentFilter = value;
      clearTimeout(opponentDebounceTimer);
      opponentDebounceTimer = setTimeout(() => loadPage(1), 350);
    }

    async function shareMatch(matchId, btn) {
      const url = `${window.location.origin}/watch.html?id=${matchId}`;
      try {
        if (navigator.share) {
          await navigator.share({ title: 'Partida de OZAMA CHESS', url });
          return;
        }
        await navigator.clipboard.writeText(url);
        if (btn) {
          const original = btn.textContent;
          btn.textContent = '✓';
          setTimeout(() => { btn.textContent = original; }, 1500);
        }
      } catch (_) {
        prompt('Copia el link para compartir:', url);
      }
    }

    async function init() {
      if (!_user || (window.OZAMA_RUNTIME?.native && !_token)) { renderNotLogged(); return; }
      document.getElementById('main-content').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Cargando historial...
        </div>
      `;
      await loadPage(1);
    }

    init();
    function refreshVisibleHistory() {
      if (!historyInitialized) return;
      if (document.visibilityState === 'visible') loadPage(currentHistoryPage);
    }
    document.addEventListener('visibilitychange', refreshVisibleHistory);
    window.addEventListener('focus', refreshVisibleHistory);
    window.setInterval(refreshVisibleHistory, 30_000);
    Object.assign(window, {
      logout,
      loadPage,
      switchGame,
      shareMatch,
      setResultFilter,
      onOpponentInput,
    });
    })();
  </script>
</body>
</html>
