  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: var(--carbon);
      --surface: var(--s1);
      --surface2: var(--s2);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--fb);
      min-height: 100vh;
      padding: 0 0 60px;
      overflow-x: hidden;
    }

    /* Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 24px;
      background: rgba(13,11,8,0.97);
      border-bottom: 1px solid rgba(200,152,60,0.18);
      gap: 12px;
      min-width: 0;
    }

    .topbar-logo {
      font-family: var(--ft);
      font-size: 16px; font-weight: 900;
      color: var(--gold); letter-spacing: 4px;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 10px;
      min-width: 0;
    }
    .topbar-logo-mark {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid rgba(200,152,60,0.48);
      box-shadow: 0 0 14px rgba(200,152,60,0.22);
    }

    .topbar-nav { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 16px; }
    .topbar-nav a {
      color: var(--dim); text-decoration: none;
      font-size: 11px; font-weight: 600; letter-spacing: 2px;
      transition: color 0.2s;
    }
    .topbar-nav a:hover { color: var(--gold); }

    /* Hero del perfil */
    .profile-hero {
      background: linear-gradient(160deg, var(--s2) 0%, var(--s1) 100%);
      border-bottom: 1px solid rgba(200,152,60,0.16);
      padding: 40px 24px 32px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }

    .avatar-ring {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #8B6914);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--ft);
      font-size: 36px; font-weight: 900; color: var(--carbon);
      box-shadow: 0 0 30px rgba(200,152,60,0.3);
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar-ring img,
    .avatar-choice img,
    .friend-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar-0 { background: linear-gradient(135deg, var(--blue-do), var(--gold)); }
    .avatar-1 { background: linear-gradient(135deg, var(--red-do), var(--gold)); }
    .avatar-2 { background: linear-gradient(135deg, #226F54, var(--gold)); }
    .avatar-3 { background: linear-gradient(135deg, #5B2A86, var(--gold)); }
    .avatar-4 { background: linear-gradient(135deg, #0F766E, var(--gold)); }
    .avatar-5 { background: linear-gradient(135deg, var(--teja), var(--gold)); }

    .profile-name {
      font-family: var(--ft);
      font-size: 24px; font-weight: 700; color: var(--gold);
      letter-spacing: 2px;
    }

    .profile-meta {
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; color: var(--dim);
    }

    .profile-country { font-size: 20px; }
    .country-code {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 28px; height: 20px;
      border: 1px solid rgba(200,152,60,0.18);
      color: var(--gold);
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      background: rgba(200,152,60,0.06);
    }

    .elo-display {
      background: rgba(200,152,60,0.1);
      border: 1px solid rgba(200,152,60,0.3);
      border-radius: 20px; padding: 6px 18px;
      font-family: var(--ft);
      font-size: 14px; font-weight: 700; color: var(--gold);
      letter-spacing: 2px;
    }

    .plan-badge {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 14px;
      border: 1px solid rgba(200,152,60,0.24);
      background: rgba(200,152,60,0.06);
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .plan-badge.premium {
      color: var(--gold);
      border-color: rgba(200,152,60,0.44);
      box-shadow: 0 0 18px rgba(200,152,60,0.16);
    }

    /* Stats grid */
    .container { max-width: 800px; margin: 0 auto; padding: 28px 20px 0; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      padding: 18px 14px;
      text-align: center;
    }

    .stat-value {
      font-family: var(--ft);
      font-size: 28px; font-weight: 900; color: var(--gold);
      line-height: 1;
    }

    .stat-label {
      font-size: 10px; font-weight: 600;
      letter-spacing: 2px; color: var(--dim);
      text-transform: uppercase; margin-top: 6px;
    }

    .stat-card.wins   .stat-value { color: #2ecc71; }
    .stat-card.losses .stat-value { color: var(--danger); }
    .stat-card.draws  .stat-value { color: var(--dim); }

    /* Seccion historial */
    .section-title {
      font-family: var(--ft);
      font-size: 13px; font-weight: 700;
      color: var(--gold); letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(200,152,60,0.1);
    }

    /* Lista de partidas */
    .match-list { display: flex; flex-direction: column; gap: 8px; }

    .match-row {
      background: var(--surface);
      border: 1px solid rgba(200,152,60,0.08);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 14px;
      transition: border-color 0.2s;
    }
    .match-row:hover { border-color: rgba(200,152,60,0.2); }

    .match-result-badge {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .badge-win  { background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.3); }
    .badge-loss { background: rgba(231,76,60,0.15);  border: 1px solid rgba(231,76,60,0.3); }
    .badge-draw { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); }

    .match-info { flex: 1; min-width: 0; }

    .match-vs {
      font-size: 14px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .match-detail {
      font-size: 11px; color: var(--dim);
      letter-spacing: 1px; margin-top: 3px;
      overflow: hidden; text-overflow: ellipsis;
    }

    .match-elo-change {
      font-size: 13px; font-weight: 700;
      letter-spacing: 1px; flex-shrink: 0;
      text-align: right;
    }
    .elo-up   { color: #2ecc71; }
    .elo-down { color: #e74c3c; }
    .elo-flat { color: var(--dim); }

    .match-date {
      font-size: 10px; color: var(--dim);
      letter-spacing: 1px; flex-shrink: 0;
      text-align: right; min-width: 60px;
    }

    /* Loading / empty */
    .loading {
      text-align: center; padding: 40px 20px;
      color: var(--dim); font-size: 13px; letter-spacing: 2px;
    }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(200,152,60,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-msg {
      text-align: center; padding: 32px 20px;
      color: var(--dim); font-size: 12px; letter-spacing: 2px;
    }

    /* Edit pais */
    .edit-section {
      padding: 20px;
      margin-bottom: 28px;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }

    .edit-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 2px; color: var(--dim);
      text-transform: uppercase; flex-shrink: 0;
    }

    .avatar-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .avatar-choice {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(200,152,60,0.25);
      color: white;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .avatar-choice:hover,
    .avatar-choice.active {
      transform: translateY(-1px);
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(200,152,60,0.25);
    }

    .edit-select {
      flex: 1; min-width: 160px;
      padding: 8px 12px;
      background: var(--surface2);
      border: 1px solid rgba(200,152,60,0.2);
      border-radius: 8px; color: var(--text);
      font-family: var(--fb);
      font-size: 14px; outline: none; cursor: pointer;
      appearance: none;
    }
    .edit-select:focus { border-color: var(--gold); }
    .edit-select option { background: var(--s2); }

    .btn-save {
      padding: 11px 22px;
      font-size: 11px;
      letter-spacing: 2px;
    }
    .btn-save.secondary {
      color: rgba(233,228,218,0.52);
    }

    .photo-upload {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 8px 12px;
      border: 1px solid rgba(200,152,60,0.25);
      border-radius: 8px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      background: rgba(200,152,60,0.06);
    }
    .photo-upload:hover {
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(200,152,60,0.18);
    }
    .photo-upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .photo-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .photo-hint {
      width: 100%;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 1px;
    }
    .photo-status {
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .friends-panel {
      padding: 18px;
      margin-bottom: 28px;
    }
    .friends-form {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .friends-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      background: var(--surface2);
      border: 1px solid rgba(200,152,60,0.18);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--fb);
      outline: none;
    }
    .friends-input:focus { border-color: var(--gold); }
    .friends-list { display: grid; gap: 8px; }
    .friend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid rgba(200,152,60,0.08);
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
    }
    .friend-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-family: var(--ft);
      font-weight: 900;
      color: #080808;
      background: linear-gradient(135deg, var(--gold), #8B6914);
    }
    .friend-main { flex: 1; min-width: 0; }
    .friend-name { font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .friend-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }

    .account-panel {
      margin-bottom: 28px;
      padding: 20px;
    }
    .account-links { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 16px; }
    .account-links a {
      padding: 8px 11px;
      border: 1px solid rgba(200,152,60,0.17);
      border-radius: 4px;
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-decoration: none;
      text-transform: uppercase;
    }
    .account-links a:hover { border-color: var(--gold); color: var(--gold); }
    .danger-zone { border-top: 1px solid rgba(203,72,58,0.26); padding-top: 14px; }
    .danger-zone summary {
      color: #d98275;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .danger-copy { margin: 13px 0; color: var(--dim); font-size: 12px; line-height: 1.55; }
    .danger-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 9px; }
    .danger-form input {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid rgba(203,72,58,0.28);
      border-radius: 4px;
      outline: 0;
      color: var(--text);
      background: rgba(0,0,0,0.28);
    }
    .danger-form input:focus { border-color: #d98275; }
    .btn-delete {
      padding: 10px 15px;
      border: 1px solid rgba(203,72,58,0.62);
      border-radius: 4px;
      color: #f1d8d3;
      background: rgba(139,35,27,0.24);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn-delete:disabled { opacity: 0.45; cursor: wait; }
    .delete-status { min-height: 18px; margin-top: 9px; color: #d98275; font-size: 11px; }

    .save-msg {
      font-size: 11px; color: #2ecc71;
      letter-spacing: 1px; display: none;
    }

    .plan-note {
      width: 100%;
      padding-top: 12px;
      border-top: 1px solid rgba(200,152,60,0.08);
      color: var(--dim);
      font-size: 12px;
      line-height: 1.55;
    }

    .plan-note strong { color: var(--gold); font-family: var(--ft); letter-spacing: 1px; }

    .personalization-panel { padding: 20px; margin-bottom: 28px; }
    .theme-swatch-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
    .theme-swatch {
      position: relative;
      width: 76px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; background: none; border: none; padding: 0;
      font-family: var(--fb); color: var(--dim);
    }
    .theme-swatch-board {
      width: 56px; height: 56px; border-radius: 10px;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      overflow: hidden; border: 2px solid rgba(200,152,60,0.18);
      transition: border-color 0.2s, transform 0.2s;
    }
    .theme-swatch-board span:nth-child(1), .theme-swatch-board span:nth-child(4) { background: var(--sw-light); }
    .theme-swatch-board span:nth-child(2), .theme-swatch-board span:nth-child(3) { background: var(--sw-dark); }
    .theme-swatch:hover .theme-swatch-board { transform: translateY(-2px); }
    .theme-swatch.is-active .theme-swatch-board { border-color: var(--gold); box-shadow: 0 0 12px rgba(200,152,60,0.35); }
    .theme-swatch-label { font-size: 10.5px; letter-spacing: 0.5px; text-align: center; }
    .theme-swatch.is-active .theme-swatch-label { color: var(--gold); font-weight: 700; }
    .theme-swatch-lock {
      position: absolute; top: -4px; right: 6px;
      font-size: 10px; background: var(--carbon); border-radius: 50%;
      width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(200,152,60,0.4);
    }
    .sound-pref-row { display: flex; align-items: center; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
    .volume-row { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 140px; }
    .volume-icon { font-size: 14px; }
    #pref-volume-slider { flex: 1; accent-color: var(--gold); }
    .premium-panel { padding: 20px; margin-bottom: 28px; }
    .premium-benefits { list-style: none; display: grid; gap: 8px; margin: 14px 0 18px; }
    .premium-benefits li {
      font-size: 12.5px; color: var(--text); line-height: 1.5;
      padding-left: 22px; position: relative;
    }
    .premium-benefits li::before {
      content: '\2726'; position: absolute; left: 0; top: 0;
      color: var(--gold); font-size: 12px;
    }
    .premium-price {
      font-family: var(--ft); font-size: 20px; font-weight: 800;
      color: var(--gold); letter-spacing: 1px; margin-bottom: 4px;
    }
    .premium-price span { font-size: 11px; color: var(--dim); font-weight: 600; letter-spacing: 1px; }
    #paypal-button-container { max-width: 320px; margin-top: 10px; }
    .premium-status-msg {
      font-size: 12px; color: var(--dim); letter-spacing: 0.5px;
      margin-top: 10px; line-height: 1.5;
    }
    .premium-active-box {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
      padding: 14px 16px; border-radius: 10px;
      background: rgba(200,152,60,0.08); border: 1px solid rgba(200,152,60,0.28);
    }
    .btn-cancel-premium {
      padding: 9px 16px; border-radius: 6px;
      border: 1px solid rgba(203,72,58,0.4);
      background: transparent; color: #d98275;
      font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
      text-transform: uppercase; cursor: pointer;
    }
    .btn-cancel-premium:hover { border-color: #d98275; background: rgba(139,35,27,0.15); }
    .btn-cancel-premium:disabled { opacity: 0.5; cursor: wait; }

    /* Paginacion */
    .pagination {
      display: flex; justify-content: center; gap: 8px; margin-top: 20px;
    }

    .page-btn {
      padding: 7px 14px;
      background: var(--surface);
      border: 1px solid rgba(200,152,60,0.15);
      border-radius: 8px; color: var(--dim);
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .page-btn:hover, .page-btn.active {
      border-color: var(--gold); color: var(--gold);
      background: rgba(200,152,60,0.08);
    }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* No logueado */
    .not-logged {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 16px; text-align: center;
    }
    .not-logged h2 { font-family: var(--ft); color: var(--gold); letter-spacing: 3px; }
    .not-logged p  { color: var(--dim); font-size: 13px; }
    .btn-login {
      display: inline-block;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .topbar { padding: 10px 14px; flex-wrap: wrap; }
      .topbar-logo { font-size: 13px; letter-spacing: 2px; }
      .topbar-logo-mark { width: 28px; height: 28px; }
      .topbar-nav { width: 100%; justify-content: center; gap: 14px; }
      .topbar-nav a { font-size: 10px; letter-spacing: 1.3px; }
      .edit-section { align-items: stretch; flex-direction: column; }
      .avatar-picker, .photo-tools { width: 100%; }
      .photo-upload, .btn-save, .edit-select { width: 100%; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .friends-form { flex-direction: column; }
      .danger-form { grid-template-columns: 1fr; }
      .match-row { gap: 10px; padding: 12px; }
      .match-result-badge { width: 34px; height: 34px; font-size: 15px; border-radius: 8px; }
      .match-detail { white-space: nowrap; max-width: 100%; }
      .match-elo-change { font-size: 12px; min-width: 34px; }
      .match-date { display: none; }
      .profile-hero { padding: 28px 16px 24px; }
    }

    /* Pestanas de navegacion entre Perfil / Historial / Ajustes.
       Cada una es su propia pagina real (no anclas de una sola pagina
       larga), para que se sientan como destinos distintos. */
    .profile-tabs {
      display: flex;
      gap: 6px;
      padding: 12px 24px;
      background: rgba(13,11,8,0.9);
      border-bottom: 1px solid rgba(200,152,60,0.1);
      overflow-x: auto;
    }
    .profile-tab {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .profile-tab:hover { color: var(--gold); background: rgba(200,152,60,0.06); }
    .profile-tab.is-active { color: var(--carbon); background: var(--gold); }
  </style>
</head>
<body>

  <!-- Topbar -->
  <nav class="topbar">
    <a href="/lobby.html" class="topbar-logo"><img class="topbar-logo-mark" src="/favicon.png?v=6" alt="">OZAMA CHESS</a>
    <div class="topbar-nav">
      <a href="/lobby.html">Lobby</a>
      <a href="/login.html" id="nav-logout" onclick="logout(); return false;">Cerrar sesion</a>
    </div>
  </nav>

  <div class="profile-tabs">
    <a href="/profile.html" class="profile-tab">Perfil</a>
    <a href="/history.html" class="profile-tab">Historial</a>
    <a href="/settings.html" class=" profile-tab is-active">Ajustes</a>
  </div>

  <!-- Contenido principal -->
  <div id="main-content"></div>

  <script>
    (async () => {
    await window.OZAMA_RUNTIME?.ready;
    const _user  = JSON.parse(localStorage.getItem('ozama-user') || 'null');
    const _token = window.OZAMA_RUNTIME?.getAuthToken?.() || '';

        function escapeHtml(value) {
          return String(value ?? '').replace(/[&<>"']/g, (char) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
          }[char]));
        }

        function avatarClass(avatar) {
          const index = Number.isFinite(Number(avatar)) ? Number(avatar) : 0;
          return `avatar-${Math.abs(index) % 6}`;
        }

        function selectAvatar(avatar) {
          const value = Math.abs(Number(avatar) || 0) % 6;
          const input = document.getElementById('avatar-select');
          const ring = document.getElementById('avatar-ring');
          const imageInput = document.getElementById('avatar-image-value');
          const photoStatus = document.getElementById('photo-status');
          if (input) input.value = value;
          if (imageInput) imageInput.value = '';
          if (photoStatus) photoStatus.textContent = '';
          if (ring) {
            ring.className = `avatar-ring ${avatarClass(value)}`;
            ring.textContent = ring.dataset.initial || '';
          }
          document.querySelectorAll('.avatar-choice').forEach((btn) => {
            btn.classList.toggle('active', Number(btn.dataset.avatar) === value);
          });
        }

        function resizeAvatarImage(file) {
          return new Promise((resolve, reject) => {
            if (!file || !/^image\/(png|jpeg|webp)$/.test(file.type)) {
              reject(new Error('Formato no valido.'));
              return;
            }
            if (file.size > 3 * 1024 * 1024) {
              reject(new Error('La foto debe pesar menos de 3 MB.'));
              return;
            }

            const reader = new FileReader();
            reader.onload = () => {
              const img = new Image();
              img.onload = () => {
                const size = 256;
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = size;
                canvas.height = size;
                const sourceSize = Math.min(img.width, img.height);
                const sx = Math.max(0, (img.width - sourceSize) / 2);
                const sy = Math.max(0, (img.height - sourceSize) / 2);
                ctx.drawImage(img, sx, sy, sourceSize, sourceSize, 0, 0, size, size);
                resolve(canvas.toDataURL('image/jpeg', 0.82));
              };
              img.onerror = () => reject(new Error('No se pudo leer la imagen.'));
              img.src = reader.result;
            };
            reader.onerror = () => reject(new Error('No se pudo abrir el archivo.'));
            reader.readAsDataURL(file);
          });
        }

        async function handleAvatarImage(event) {
          try {
            const image = await resizeAvatarImage(event.target.files?.[0]);
            const input = document.getElementById('avatar-image-value');
            const ring = document.getElementById('avatar-ring');
            const photoStatus = document.getElementById('photo-status');
            if (input) input.value = image;
            if (ring) {
              ring.className = 'avatar-ring';
              ring.innerHTML = `<img src="${image}" alt="">`;
            }
            if (photoStatus) photoStatus.textContent = 'Foto lista. Toca Guardar.';
            document.querySelectorAll('.avatar-choice').forEach((btn) => btn.classList.remove('active'));
          } catch (err) {
            alert(err.message || 'No se pudo preparar la foto.');
          } finally {
            event.target.value = '';
          }
        }

        function clearAvatarImage() {
          const input = document.getElementById('avatar-image-value');
          if (input) input.value = '';
          selectAvatar(document.getElementById('avatar-select')?.value || 0);
          const photoStatus = document.getElementById('photo-status');
          if (photoStatus) photoStatus.textContent = 'Foto quitada. Toca Guardar.';
        }

        async function logout() {
          try {
            await fetch('/api/auth/logout', {
              method: 'POST',
              credentials: 'include',
              keepalive: true,
              headers: _token ? { Authorization: `Bearer ${_token}` } : {}
            });
          }
          catch (_) {}
          await window.OZAMA_RUNTIME?.clearAuthToken?.().catch(() => {});
          localStorage.removeItem('ozama-user');
          sessionStorage.clear();
          window.location.replace('/login.html');
        }

        function renderNotLogged() {
          document.getElementById('main-content').innerHTML = `
            <div class="not-logged oz-card oz-enter" style="--d:1">
              <div style="font-family:var(--ft);font-size:34px;color:var(--gold);letter-spacing:4px;">OC</div>
              <h2>ACCESO REQUERIDO</h2>
              <p>Necesitas una cuenta para ver tu perfil.</p>
              <a href="/login.html" class="btn-login btn-primary">Iniciar sesion</a>
            </div>
          `;
        }

    function renderSettings(user) {
      const avatar = Math.abs(Number(user.avatar) || 0) % 6;
      const initial = escapeHtml((user.username || '?')[0].toUpperCase());
      const avatarImage = user.avatarImage || '';
      const premiumUntil = user.premiumUntil ? new Date(user.premiumUntil) : null;
      const premiumActive = user.plan === 'premium' && (!premiumUntil || premiumUntil > new Date());
      const planLabel = premiumActive ? 'Premium' : 'Free';
      const planNote = premiumActive
        ? 'Premium activo: beneficios visuales, avatares exclusivos y estadisticas avanzadas cuando se activen.'
        : 'Plan Free activo. Premium llegara despues como experiencia de confort, sin ventajas competitivas.';

      document.getElementById('main-content').innerHTML = `
        <div class="container" style="padding-top:28px;">
                    <div class="edit-section oz-card oz-enter" id="ajustes" style="--d:5">
                      <span class="edit-label">Avatar</span>
                      <input type="hidden" id="avatar-select" value="${avatar}">
                      <input type="hidden" id="avatar-image-value" value="${escapeHtml(avatarImage)}">
                      <div class="avatar-picker">
                        ${[0,1,2,3,4,5].map(i => `
                          <button type="button" class="avatar-choice ${avatarClass(i)} ${!avatarImage && i === avatar ? 'active' : ''}" data-avatar="${i}" onclick="selectAvatar(${i})">${initial}</button>
                        `).join('')}
                      </div>
                      <span class="edit-label">Foto de perfil</span>
                      <div class="photo-tools">
                        <label class="photo-upload">Subir foto
                          <input type="file" accept="image/png,image/jpeg,image/webp" onchange="handleAvatarImage(event)">
                        </label>
                        <button class="btn-save btn-danger secondary" onclick="clearAvatarImage()">Quitar foto</button>
                        <span class="photo-status" id="photo-status">${avatarImage ? 'Foto activa' : ''}</span>
                        <div class="photo-hint">PNG, JPG o WebP. Se recorta en cuadrado y se guarda al tocar Guardar.</div>
                      </div>
                      <span class="edit-label">Pais</span>
                      <select class="edit-select" id="country-select">
                        <option value="DO" ${user.country==='DO' ? 'selected' : ''}>DO - Republica Dominicana</option>
                        <option value="US" ${user.country==='US' ? 'selected' : ''}>US - Estados Unidos</option>
                        <option value="ES" ${user.country==='ES' ? 'selected' : ''}>ES - Espana</option>
                        <option value="MX" ${user.country==='MX' ? 'selected' : ''}>MX - Mexico</option>
                        <option value="CO" ${user.country==='CO' ? 'selected' : ''}>CO - Colombia</option>
                        <option value="VE" ${user.country==='VE' ? 'selected' : ''}>VE - Venezuela</option>
                        <option value="PR" ${user.country==='PR' ? 'selected' : ''}>PR - Puerto Rico</option>
                        <option value="CU" ${user.country==='CU' ? 'selected' : ''}>CU - Cuba</option>
                        <option value="HT" ${user.country==='HT' ? 'selected' : ''}>HT - Haiti</option>
                        <option value="BR" ${user.country==='BR' ? 'selected' : ''}>BR - Brasil</option>
                        <option value="AR" ${user.country==='AR' ? 'selected' : ''}>AR - Argentina</option>
                        <option value="OTHER" ${user.country==='OTHER' ? 'selected' : ''}>Otro</option>
                      </select>
                      <button class="btn-save btn-primary" onclick="saveProfile()">Guardar</button>
                      <span class="save-msg" id="save-msg">Guardado</span>
                      <div class="plan-note"><strong>Plan ${planLabel}</strong><br>${planNote}</div>
                    </div>

                    <div class="personalization-panel oz-card oz-enter" id="personalization-panel" style="--d:5">
                      <div class="section-title">Personalización</div>
                      <span class="edit-label">Tema de tablero</span>
                      <div class="theme-swatch-row" id="theme-swatch-row"></div>
                      <span class="edit-label" style="margin-top:16px;display:block;">Sonido</span>
                      <div class="sound-pref-row">
                        <button class="btn-save secondary" id="pref-mute-btn" onclick="togglePrefMute()">Sonido: ON</button>
                        <div class="volume-row">
                          <span class="volume-icon">🔊</span>
                          <input type="range" id="pref-volume-slider" min="0" max="100" value="82" oninput="onPrefVolumeInput(this.value)">
                        </div>
                      </div>
                    </div>

                    <div class="premium-panel oz-card oz-enter" id="premium-panel" style="--d:6">
                      <div class="section-title">OZAMA Premium</div>
                      <ul class="premium-benefits">
                        <li>Marco dorado + insignia PREMIUM en tu avatar</li>
                        <li>Temas de tablero exclusivos (Ébano y Caoba)</li>
                        <li>Exportar tus partidas en formato PGN</li>
                        <li>Estadisticas avanzadas: color con mas victorias, duracion y aperturas</li>
                        <li>Analisis post-partida: deteccion de errores graves e imprecisiones</li>
                      </ul>
                      <div style="color:var(--dim);font-size:11px;letter-spacing:0.5px;margin-bottom:14px;">Solo cosmetico y de comodidad -- nunca da ventaja dentro de la partida.</div>
                      <div id="premium-panel-body"><div class="loading" style="padding:12px 0;"><div class="spinner" style="width:22px;height:22px;"></div></div></div>
                    </div>

                    <div class="account-panel oz-card oz-enter" id="cuenta" style="--d:7">
                      <div class="section-title">Cuenta y privacidad</div>
                      <div class="account-links">
                        <a href="/privacy.html">Privacidad</a>
                        <a href="/terms.html">Terminos</a>
                        <a href="/support.html">Soporte</a>
                      </div>
                      <details class="danger-zone">
                        <summary>Eliminar cuenta</summary>
                        <p class="danger-copy">Esta accion elimina tu acceso, perfil, foto y amistades. Los resultados competitivos pueden permanecer anonimizados y no se puede deshacer.</p>
                        <div class="danger-form">
                          <input id="delete-password" type="password" autocomplete="current-password" maxlength="128" placeholder="Contrasena actual">
                          <input id="delete-confirm" type="text" maxlength="8" autocomplete="off" placeholder="Escribe ELIMINAR">
                          <button class="btn-delete btn-danger" id="delete-account-btn" type="button" onclick="deleteAccount()">Eliminar cuenta</button>
                        </div>
                        <div class="delete-status" id="delete-account-status" role="status"></div>
                      </details>
                    </div>

        </div>
      `;
    }

    let _paypalSdkPromise = null;
    function loadPaypalSdk(clientId) {
      if (_paypalSdkPromise) return _paypalSdkPromise;
      _paypalSdkPromise = new Promise((resolve, reject) => {
        if (window.paypal) { resolve(window.paypal); return; }
        const script = document.createElement('script');
        script.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(clientId)}&vault=true&intent=subscription`;
        script.onload = () => resolve(window.paypal);
        script.onerror = () => reject(new Error('No se pudo cargar PayPal.'));
        document.head.appendChild(script);
      });
      return _paypalSdkPromise;
    }

    async function initPremiumPanel(user) {
      const body = document.getElementById('premium-panel-body');
      if (!body) return;

      const premiumUntil = user.premiumUntil ? new Date(user.premiumUntil) : null;
      const premiumActive = user.plan === 'premium' && (!premiumUntil || premiumUntil > new Date());

      if (premiumActive) {
        const untilLabel = premiumUntil
          ? premiumUntil.toLocaleDateString('es-DO', { year: 'numeric', month: 'long', day: 'numeric' })
          : 'sin fecha limite';
        body.innerHTML = `
          <div class="premium-active-box">
            <div>
              <div style="color:var(--gold);font-weight:800;font-size:13px;letter-spacing:1px;">Premium activo</div>
              <div style="color:var(--dim);font-size:11px;margin-top:3px;">Se renueva/vence el ${escapeHtml(untilLabel)}</div>
            </div>
            <button class="btn-cancel-premium" id="cancel-premium-btn" onclick="cancelPremium()">Cancelar suscripcion</button>
          </div>
          <div class="premium-status-msg" id="premium-status-msg"></div>
        `;
        return;
      }

      try {
        const res = await fetch('/api/billing/config', { cache: 'no-store' });
        const config = await res.json();
        if (!config?.enabled || !config?.clientId || !config?.planId) {
          body.innerHTML = '<div class="premium-status-msg">Premium todavia no esta disponible para pago. Vuelve pronto.</div>';
          return;
        }

        body.innerHTML = `
          <div class="premium-price">$4.99 <span>USD / mes, cancelas cuando quieras</span></div>
          <div id="paypal-button-container"></div>
          <div class="premium-status-msg" id="premium-status-msg"></div>
        `;

        const paypal = await loadPaypalSdk(config.clientId);
        const statusMsg = document.getElementById('premium-status-msg');
        paypal.Buttons({
          style: { shape: 'pill', color: 'gold', layout: 'vertical', label: 'subscribe' },
          createSubscription: (_data, actions) => actions.subscription.create({ plan_id: config.planId }),
          onApprove: async (data) => {
            if (statusMsg) statusMsg.textContent = 'Confirmando tu suscripcion...';
            try {
              const confirmRes = await fetch('/api/billing/confirm', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
                body: JSON.stringify({ subscriptionID: data.subscriptionID }),
              });
              const confirmData = await confirmRes.json().catch(() => ({}));
              if (!confirmRes.ok) throw new Error(confirmData.error || 'No se pudo confirmar la suscripcion.');
              if (statusMsg) statusMsg.textContent = 'Listo! Ya sos Premium.';
              const meRes = await fetch('/api/user/me', { headers: { Authorization: `Bearer ${_token}` }, cache: 'no-store' });
              const meData = await meRes.json();
              localStorage.setItem('ozama-user', JSON.stringify(meData.user));
              renderSettings(meData.user);
              initPremiumPanel(meData.user);
              renderPersonalizationPanel(meData.user);
            } catch (err) {
              if (statusMsg) statusMsg.textContent = err.message || 'No se pudo confirmar la suscripcion.';
            }
          },
          onError: () => {
            if (statusMsg) statusMsg.textContent = 'Hubo un problema con PayPal. Intenta de nuevo.';
          },
        }).render('#paypal-button-container');
      } catch (err) {
        body.innerHTML = '<div class="premium-status-msg">No se pudo cargar Premium en este momento.</div>';
      }
    }

    async function cancelPremium() {
      const button = document.getElementById('cancel-premium-btn');
      const statusMsg = document.getElementById('premium-status-msg');
      if (!confirm('Vas a cancelar tu suscripcion Premium. Seguis con los beneficios hasta que venza el periodo ya pago. Continuar?')) return;
      if (button) { button.disabled = true; button.textContent = 'Cancelando...'; }
      try {
        const res = await fetch('/api/billing/cancel', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'No se pudo cancelar.');
        if (statusMsg) statusMsg.textContent = 'Suscripcion cancelada. Seguira activa hasta la fecha de vencimiento ya pagada.';
        if (button) button.remove();
      } catch (err) {
        if (statusMsg) statusMsg.textContent = err.message || 'No se pudo cancelar.';
        if (button) { button.disabled = false; button.textContent = 'Cancelar suscripcion'; }
      }
    }

    async function saveProfile() {
      const country = document.getElementById('country-select').value;
      const avatar = Number(document.getElementById('avatar-select').value || 0);
      const avatarImage = document.getElementById('avatar-image-value')?.value || '';
      try {
        const res = await fetch('/api/user/me', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${_token}`,
          },
          body: JSON.stringify({ country, avatar, avatarImage }),
        });
        if (!res.ok) throw new Error();
        const data = await res.json();

        const updatedUser = {
          ..._user,
          country: data.user.country,
          avatar: data.user.avatar,
          avatarImage: data.user.avatarImage,
          plan: data.user.plan,
          premiumUntil: data.user.premiumUntil,
          subscriptionStatus: data.user.subscriptionStatus,
        };
        localStorage.setItem('ozama-user', JSON.stringify(updatedUser));

        const msg = document.getElementById('save-msg');
        if (msg) { msg.style.display = 'inline'; setTimeout(() => { msg.style.display = 'none'; }, 2000); }
      } catch (err) {
        alert('Error al guardar.');
      }
    }

    async function deleteAccount() {
      const password = document.getElementById('delete-password');
      const confirmation = document.getElementById('delete-confirm');
      const button = document.getElementById('delete-account-btn');
      const status = document.getElementById('delete-account-status');
      if (!password || !confirmation || !button || !status) return;

      status.textContent = '';
      if (!password.value || confirmation.value.trim().toUpperCase() !== 'ELIMINAR') {
        status.textContent = 'Escribe tu contrasena y la palabra ELIMINAR.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Eliminando...';
      try {
        const res = await fetch('/api/user/me', {
          method: 'DELETE',
          headers: {
            Authorization: `Bearer ${_token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            currentPassword: password.value,
            confirmation: confirmation.value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'No se pudo eliminar la cuenta.');

        await window.OZAMA_RUNTIME?.clearAuthToken?.().catch(() => {});
        localStorage.removeItem('ozama-user');
        sessionStorage.clear();
        window.location.replace('/account-deletion.html?deleted=1');
      } catch (err) {
        status.textContent = err.message || 'No se pudo eliminar la cuenta.';
        button.disabled = false;
        button.textContent = 'Eliminar cuenta';
      }
    }

    async function init() {
      if (!_user || (window.OZAMA_RUNTIME?.native && !_token)) { renderNotLogged(); return; }
      document.getElementById('main-content').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Cargando ajustes...
        </div>
      `;
      try {
        const res = await fetch('/api/user/me', { headers: { Authorization: `Bearer ${_token}` }, cache: 'no-store' });
        if (!res.ok) { renderNotLogged(); return; }
        const data = await res.json();
        localStorage.setItem('ozama-user', JSON.stringify(data.user));
        renderSettings(data.user);
        initPremiumPanel(data.user);
        renderPersonalizationPanel(data.user);
        // El contenido se arma async, asi que el anchor #premium-panel del
        // link no lo agarra el navegador solo -- lo forzamos aca.
        if (window.location.hash === '#premium-panel') {
          document.getElementById('premium-panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      } catch (err) {
        document.getElementById('main-content').innerHTML =
          '<div class="loading">Error cargando los ajustes. Recarga la pagina.</div>';
      }
    }

    // ── Personalizacion (Fase 2): temas de tablero + sonido ──
    // Todo pasa por OZAMA_PREFS (public/preferences.js) -- mismo
    // camino que usan game.html y damas.html, asi un cambio hecho aca
    // se ve reflejado la proxima vez que se entre a jugar.
    let _prefsUser = _user;
    function renderPersonalizationPanel(user) {
      if (user) _prefsUser = user;
      const row = document.getElementById('theme-swatch-row');
      if (!row || typeof OZAMA_PREFS === 'undefined') return;

      const current = OZAMA_PREFS.current();
      const themes = OZAMA_PREFS.availableThemes(_prefsUser);
      row.innerHTML = themes.map((t) => `
        <button type="button" class="theme-swatch ${t.key === current.boardTheme ? 'is-active' : ''}" onclick="selectBoardTheme('${t.key}')" title="${escapeHtml(t.label)}${t.locked ? ' (Premium)' : ''}">
          <span class="theme-swatch-board" style="--sw-light:${swatchColor(t.key, 'light')};--sw-dark:${swatchColor(t.key, 'dark')};">
            <span></span><span></span><span></span><span></span>
          </span>
          ${t.locked ? '<span class="theme-swatch-lock">🔒</span>' : ''}
          <span class="theme-swatch-label">${escapeHtml(t.label)}</span>
        </button>
      `).join('');

      const muteBtn = document.getElementById('pref-mute-btn');
      if (muteBtn) muteBtn.textContent = current.soundMuted ? 'Sonido: OFF' : 'Sonido: ON';
      const slider = document.getElementById('pref-volume-slider');
      if (slider) slider.value = String(Math.round(current.soundVolume * 100));
    }

    function swatchColor(themeKey, which) {
      const colors = {
        colonial: { light: '#C9B79C', dark: '#5C3A1E' },
        marmol:   { light: '#EDE7DC', dark: '#8B8478' },
        ebano:    { light: '#3A3630', dark: '#14120F' },
        caoba:    { light: '#D9B98C', dark: '#6B2E1F' },
      };
      return colors[themeKey]?.[which] || '#888';
    }

    async function selectBoardTheme(key) {
      const themes = OZAMA_PREFS.availableThemes(_prefsUser);
      const def = themes.find((t) => t.key === key);
      if (def?.locked) {
        alert('Ese tema de tablero es exclusivo de OZAMA Premium.');
        return;
      }
      const result = await OZAMA_PREFS.save({ boardTheme: key });
      if (!result.ok) alert(result.error || 'No se pudo guardar el tema.');
      renderPersonalizationPanel();
    }

    function togglePrefMute() {
      const current = OZAMA_PREFS.current();
      OZAMA_PREFS.save({ soundMuted: !current.soundMuted });
      renderPersonalizationPanel();
    }

    function onPrefVolumeInput(value) {
      const volume = Math.max(0, Math.min(1, Number(value) / 100));
      OZAMA_PREFS.save({ soundVolume: volume });
    }

    init();
    Object.assign(window, {
      logout,
