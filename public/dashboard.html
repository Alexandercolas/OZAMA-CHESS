<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://flagcdn.com; media-src 'self'; connect-src 'self' https://ozama-chess.onrender.com">
  <script src="/mobile-runtime.js"></script>
  <meta name="theme-color" content="#0D0B08"/>
  <meta name="color-scheme" content="dark"/>
  <title>OZAMA - Panel de Jugador</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png?v=5">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <script src="/toast.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--carbon); color: var(--text); font-family: var(--fb); min-height: 100vh; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: rgba(13,11,8,0.97); border-bottom: 1px solid rgba(200,152,60,0.18); }
    .topbar a.brand { color: var(--gold); font-family: var(--ft); font-weight: 900; letter-spacing: 3px; text-decoration: none; font-size: 15px; }
    .topbar a.back { color: var(--dim); text-decoration: none; font-size: 13px; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 28px 16px 60px; }

    .hero { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .av { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: linear-gradient(135deg, var(--gold), #8B6914); display: flex; align-items: center; justify-content: center; font-family: var(--ft); font-weight: 900; color: var(--carbon); font-size: 26px; box-sizing: content-box; }
    .av img { width: 100%; height: 100%; object-fit: cover; }
    .av[data-frame="bronce"] { box-shadow: 0 0 0 4px #8B5A2B; }
    .av[data-frame="plata"] { box-shadow: 0 0 0 4px #C7CCD1; }
    .av[data-frame="oro"] { box-shadow: 0 0 0 4px #FFD34D; }
    .av[data-frame="racha"] { box-shadow: 0 0 0 4px #E2571C, 0 0 14px 2px rgba(226,87,28,0.5); }
    .av[data-frame="tactico"] { box-shadow: 0 0 0 4px #3F7D4E; }
    .av[data-frame="cazador"] { box-shadow: 0 0 0 4px #7A1F2B; }
    .av[data-frame="centenario"] { box-shadow: 0 0 0 4px #6B4A2A; }
    .av[data-frame="campeon"] { box-shadow: 0 0 0 4px #FFD700, 0 0 18px 3px rgba(255,215,0,0.55); }
    .hero-name { font-family: var(--ft); font-size: 22px; color: var(--text); }
    .hero-name .pro { font-size: 9px; vertical-align: middle; margin-left: 8px; padding: 2px 6px; border-radius: 5px; background: rgba(200,152,60,0.16); color: var(--gold); font-weight: 800; letter-spacing: 1px; }
    .level-line { font-family: var(--fm); font-size: 11.5px; color: var(--dim); margin-top: 4px; }
    .xp-bar-track { width: 100%; max-width: 220px; height: 6px; border-radius: 3px; background: var(--s2); overflow: hidden; margin-top: 6px; }
    .xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-2, #E2B960)); }

    .games-row { display: flex; gap: 12px; margin-bottom: 20px; }
    .game-summary {
      flex: 1; background: var(--s1); border: 1px solid rgba(200,152,60,0.16); border-radius: 10px; padding: 14px; text-align: center;
      transition: transform var(--dur-base) var(--ease-out), border-color var(--dur-base), box-shadow var(--dur-base);
    }
    .game-summary:hover { transform: translateY(-2px); border-color: rgba(200,152,60,0.4); box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
    .game-summary .g-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .game-summary .g-elo { font-family: var(--fm); font-weight: 700; font-size: 22px; color: var(--gold); }
    .game-summary .g-rank { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .game-summary .g-record { font-size: 10.5px; color: var(--faint, var(--dim)); margin-top: 6px; }
    .game-summary .g-streak { font-size: 10px; color: var(--faint, var(--dim)); margin-top: 3px; }
    .game-summary .g-streak strong { color: #E2571C; }

    .section-title { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin: 24px 0 10px; }

    /* Proximo torneo (Fase 21: dashboard "vivo") */
    .live-card {
      display: flex; align-items: center; gap: 12px; background: var(--s1); border: 1px solid rgba(200,152,60,0.22); border-radius: 10px;
      padding: 14px; text-decoration: none; color: var(--text); margin-bottom: 4px;
      transition: transform var(--dur-base) var(--ease-out), border-color var(--dur-base), box-shadow var(--dur-base);
    }
    .live-card:hover { transform: translateY(-2px); border-color: rgba(200,152,60,0.5); box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
    .live-card .lc-icon { font-size: 26px; flex-shrink: 0; }
    .live-card .lc-name { font-size: 13px; font-weight: 700; }
    .live-card .lc-meta { font-size: 10.5px; color: var(--dim); margin-top: 2px; }
    .live-card .lc-countdown { margin-left: auto; font-family: var(--fm); font-size: 12px; color: var(--gold); font-weight: 700; flex-shrink: 0; }

    /* Tu posicion en el ranking */
    .rank-chip {
      display: flex; align-items: center; gap: 10px; background: var(--s1); border: 1px solid rgba(200,152,60,0.16); border-radius: 10px;
      padding: 12px 14px; text-decoration: none; color: var(--text); margin-bottom: 4px;
      transition: transform var(--dur-base) var(--ease-out), border-color var(--dur-base), box-shadow var(--dur-base);
    }
    .rank-chip:hover { transform: translateY(-2px); border-color: rgba(200,152,60,0.4); box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
    .rank-chip .rc-icon { font-size: 18px; }
    .rank-chip .rc-text { font-size: 12px; }
    .rank-chip .rc-text strong { color: var(--gold-2, var(--gold)); }

    .daily-row { display: flex; gap: 12px; margin-bottom: 8px; }

    /* Retos de la semana (Fase 13) -- lista compacta, no una card por
       reto (serian 3 paneles para 3 lineas de informacion). */
    .weekly-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .weekly-item { display: flex; align-items: center; gap: 10px; background: var(--s1); border: 1px solid rgba(200,152,60,0.16); border-radius: 10px; padding: 10px 14px; }
    .weekly-item.done { border-color: rgba(46,160,67,0.35); }
    .w-icon { font-size: 18px; flex-shrink: 0; }
    .w-body { flex: 1; min-width: 0; }
    .w-name { font-size: 11.5px; font-weight: 700; margin-bottom: 4px; }
    .weekly-item.done .w-name { color: #7FD98A; }
    .w-count { font-family: var(--fm); font-size: 11px; color: var(--gold-2, var(--gold)); flex-shrink: 0; }
    .daily-card {
      flex: 1; display: flex; align-items: center; gap: 10px; background: var(--s1); border: 1px solid rgba(200,152,60,0.16); border-radius: 10px;
      padding: 12px 14px; text-decoration: none; color: var(--text);
      transition: transform var(--dur-base) var(--ease-out), border-color var(--dur-base), box-shadow var(--dur-base);
    }
    .daily-card:hover { transform: translateY(-2px); border-color: rgba(200,152,60,0.4); box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
    .daily-card .d-icon { font-size: 22px; }
    .daily-card .d-name { font-size: 12.5px; font-weight: 700; }
    .daily-card .d-status { font-size: 10.5px; color: var(--dim); margin-top: 2px; }
    .daily-card.done { border-color: rgba(46,160,67,0.35); }
    .daily-card.done .d-status { color: #7FD98A; }

    .achv-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
    .achv-chip {
      flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--s1); border: 1px solid rgba(200,152,60,0.16);
      border-radius: 10px; padding: 10px 14px; min-width: 76px;
      transition: transform var(--dur-base) var(--ease-out), border-color var(--dur-base), box-shadow var(--dur-base);
    }
    .achv-chip:hover { transform: translateY(-2px); border-color: rgba(200,152,60,0.4); box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
    .achv-chip .a-icon { font-size: 22px; }
    .achv-chip .a-name { font-size: 9.5px; color: var(--dim); text-align: center; line-height: 1.3; }
    .achv-empty { color: var(--dim); font-size: 12px; padding: 10px 0; }

    .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .quick-tile {
      display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--s1); border: 1px solid rgba(200,152,60,0.16);
      border-radius: 10px; padding: 16px 8px; text-decoration: none; color: var(--text); text-align: center;
      transition: transform var(--dur-base) var(--ease-out), border-color var(--dur-base), box-shadow var(--dur-base);
    }
    .quick-tile:hover { transform: translateY(-2px); border-color: rgba(200,152,60,0.4); box-shadow: 0 8px 20px rgba(0,0,0,0.35); }
    .quick-tile:active { transform: translateY(0) scale(0.97); }
    .quick-tile .q-icon { font-size: 24px; }
    .quick-tile .q-label { font-size: 11px; font-weight: 700; }

    .season-line { font-size: 10.5px; color: var(--faint, var(--dim)); margin-top: 8px; }
    .season-line strong { color: var(--gold-2, var(--gold)); font-weight: 700; }

    .login-gate { text-align: center; padding: 60px 20px; color: var(--dim); }
    .login-gate a { color: var(--gold); font-weight: 700; text-decoration: none; }

    /* Skeleton de carga (Fase 19) -- mantiene la forma del panel real
       en vez de un texto suelto, asi no se siente congelado. */
    .skel-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .skel-av { width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; }
    .skel-lines { flex: 1; }
  </style>
</head>
<body>
  <nav class="topbar"><a class="brand" href="/">OZAMA</a><a class="back" href="/lobby.html">← Lobby</a></nav>
  <div class="wrap" id="content"><div class="loading">Cargando panel...</div></div>

  <script>
    let _token = '';

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
    }
    function levelFromXp(xp) { return 1 + Math.floor(Number(xp || 0) / 100); }
    function xpIntoLevel(xp) { return Number(xp || 0) % 100; }
    function rankTier(elo) {
      if (elo >= 1800) return 'Alcázar';
      if (elo >= 1400) return 'Maestro';
      if (elo >= 1000) return 'Centinela';
      return 'Aprendiz';
    }
    function avatarHtml(u) {
      if (u.avatarImage) return `<img src="${escapeHtml(u.avatarImage)}" alt="">`;
      return escapeHtml((u.username || '?').charAt(0).toUpperCase());
    }
    function record(stats) {
      const s = stats || { wins: 0, losses: 0, draws: 0 };
      return `${s.wins}V ${s.losses}D ${s.draws}T`;
    }

    async function fetchJson(url) {
      try {
        const res = await fetch(url, { headers: { Authorization: `Bearer ${_token}` }, cache: 'no-store' });
        if (!res.ok) return null;
        return await res.json();
      } catch (_) { return null; }
    }

    const gameLabels = { chess: '♟ Ajedrez', checkers: '⚫ Damas' };

    // Mismo criterio que tournaments.html: solo cuenta regresiva si
    // empieza en menos de 24h, si no alcanza con la fecha (aca no hay
    // ticker en vivo -- el dashboard no es la pagina de torneos, con
    // recargar alcanza).
    function tournamentTimeLabel(startsAt) {
      if (!startsAt) return '';
      const diff = new Date(startsAt).getTime() - Date.now();
      if (diff <= 0) return 'Empezando...';
      if (diff > 24 * 3600 * 1000) {
        return new Date(startsAt).toLocaleDateString('es-DO', { day: 'numeric', month: 'short' });
      }
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      return `en ${h}h ${m}m`;
    }

    function dailyCardHtml({ href, icon, name, done }) {
      return `
        <a class="daily-card ${done ? 'done' : ''}" href="${href}">
          <span class="d-icon">${icon}</span>
          <span>
            <span class="d-name">${escapeHtml(name)}</span>
            <div class="d-status">${done ? '✓ Resuelto hoy' : 'Desafío disponible'}</div>
          </span>
        </a>
      `;
    }

    async function init() {
      const content = document.getElementById('content');
      window.OZAMA_RUNTIME && await window.OZAMA_RUNTIME.ready;
      _token = window.OZAMA_RUNTIME?.getAuthToken?.() || '';
      let user = null;
      try { user = JSON.parse(localStorage.getItem('ozama-user') || 'null'); } catch (_) {}

      if (!user || (window.OZAMA_RUNTIME?.native && !_token)) {
        content.innerHTML = `
          <div class="login-gate">
            Inicia sesión para ver tu panel de jugador.<br><br>
            <a href="/login.html">Iniciar sesión →</a>
          </div>`;
        return;
      }

      content.innerHTML = `
        <div class="skel-hero">
          <div class="skeleton skel-av"></div>
          <div class="skel-lines">
            <div class="skeleton skeleton-line w-60"></div>
            <div class="skeleton skeleton-line w-40"></div>
          </div>
        </div>
        <div class="games-row">
          <div class="skeleton" style="flex:1;height:88px;"></div>
          <div class="skeleton" style="flex:1;height:88px;"></div>
        </div>
      `;

      const [meData, chessDaily, damasDaily, achData, eventsData, lbData, weeklyData] = await Promise.all([
        fetchJson('/api/user/me'),
        fetchJson('/api/puzzles/daily'),
        fetchJson('/api/damas-puzzles/daily'),
        fetchJson('/api/user/achievements'),
        fetchJson('/api/events'),
        fetchJson('/api/user/leaderboard'),
        fetchJson('/api/user/weekly-challenges'),
      ]);
      const me = meData?.user || user;

      // Proximo torneo (Fase 21: dashboard "vivo") -- el mas cercano
      // en el tiempo, de cualquier juego, entre los que ya estan
      // abiertos a inscripcion. Dato real de /api/events, nunca
      // inventado.
      const upcomingTournament = (eventsData?.events || [])
        .filter((e) => e.type === 'tournament' && e.status !== 'active')
        .sort((a, b) => new Date(a.startsAt || 0) - new Date(b.startsAt || 0))[0] || null;

      // Tu posicion en el ranking global de Ajedrez -- si estas en el
      // top 20 el propio listado te contiene: se busca ahi. Si no, el
      // endpoint ya calcula yourRank aparte. Si no hay datos (invitado
      // recien registrado, ranking vacio) simplemente no se muestra.
      let yourRank = lbData?.yourRank || null;
      if (!yourRank && lbData?.players) {
        const idx = lbData.players.findIndex((p) => String(p._id) === String(me._id));
        if (idx !== -1) yourRank = idx + 1;
      }

      const level = levelFromXp(me.xp);
      const xpPct = xpIntoLevel(me.xp);
      const unlocked = (achData?.achievements || []).filter((a) => a.unlocked).sort((a, b) => new Date(b.unlockedAt) - new Date(a.unlockedAt));
      const recentAchv = unlocked.slice(0, 6);

      content.innerHTML = `
        <div class="hero">
          <div class="av" data-frame="${escapeHtml(me.equippedFrame || 'ninguno')}">${avatarHtml(me)}</div>
          <div>
            <div class="hero-name">${escapeHtml(me.username)}${me.premiumActive ? '<span class="pro">PRO</span>' : ''}</div>
            <div class="level-line">${escapeHtml(me.globalTitle || 'Novato')} · Nivel ${level} · ${xpPct}/100 XP</div>
            <div class="xp-bar-track"><div class="xp-bar-fill" style="width:${xpPct}%"></div></div>
            ${me.season ? `<div class="season-line">🏆 <strong>${escapeHtml(me.season.name)}</strong> · termina en ${me.season.daysRemaining} día${me.season.daysRemaining === 1 ? '' : 's'}</div>` : ''}
          </div>
        </div>

        <div class="games-row">
          <div class="game-summary">
            <div class="g-label">♟ Ajedrez</div>
            <div class="g-elo">${me.elo}</div>
            <div class="g-rank">${rankTier(me.elo)}</div>
            <div class="g-record">${record(me.stats)}</div>
            ${me.stats?.streak > 1 ? `<div class="g-streak">🔥 Racha de <strong>${me.stats.streak}</strong></div>` : ''}
          </div>
          <div class="game-summary">
            <div class="g-label">⚫ Damas</div>
            <div class="g-elo">${me.damasElo}</div>
            <div class="g-rank">${rankTier(me.damasElo)}</div>
            <div class="g-record">${record(me.damasStats)}</div>
            ${me.damasStats?.streak > 1 ? `<div class="g-streak">🔥 Racha de <strong>${me.damasStats.streak}</strong></div>` : ''}
          </div>
        </div>

        ${upcomingTournament ? `
          <div class="section-title">Próximo torneo</div>
          <a class="live-card" href="/tournaments.html?id=${upcomingTournament._id}">
            <span class="lc-icon">${escapeHtml(upcomingTournament.icon || '🏆')}</span>
            <span>
              <div class="lc-name">${escapeHtml(upcomingTournament.title)}</div>
              <div class="lc-meta">${gameLabels[upcomingTournament.gameType] || gameLabels.chess}${upcomingTournament.timeControl ? ' · ' + escapeHtml(upcomingTournament.timeControl) : ''}</div>
            </span>
            <span class="lc-countdown">${tournamentTimeLabel(upcomingTournament.startsAt)}</span>
          </a>
        ` : ''}

        ${yourRank ? `
          <a class="rank-chip" href="/leaderboard.html">
            <span class="rc-icon">📊</span>
            <span class="rc-text">Estás <strong>#${yourRank}</strong> en el ranking global de Ajedrez</span>
          </a>
        ` : ''}

        <div class="section-title">Desafíos de hoy</div>
        <div class="daily-row">
          ${dailyCardHtml({ href: '/training.html', icon: '♟', name: 'Ajedrez', done: !!chessDaily?.alreadyDone })}
          ${dailyCardHtml({ href: '/damas-training.html', icon: '⚫', name: 'Damas', done: !!damasDaily?.alreadyDone })}
        </div>

        ${weeklyData?.challenges?.length ? `
          <div class="section-title">Retos de la semana</div>
          <div class="weekly-list">
            ${weeklyData.challenges.map((c) => `
              <div class="weekly-item ${c.completed ? 'done' : ''}">
                <span class="w-icon">${c.completed ? '✅' : c.icon}</span>
                <div class="w-body">
                  <div class="w-name">${escapeHtml(c.name)}</div>
                  <div class="oz-progress-track"><div class="oz-progress-fill" style="width:${Math.round((c.current / c.target) * 100)}%"></div></div>
                </div>
                <span class="w-count">${c.current}/${c.target}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}

        <div class="section-title">Logros recientes</div>
        <div class="achv-strip">
          ${recentAchv.length ? recentAchv.map((a) => `
            <div class="achv-chip" title="${escapeHtml(a.description)}">
              <span class="a-icon">${a.icon}</span>
              <span class="a-name">${escapeHtml(a.name)}</span>
            </div>
          `).join('') : '<div class="achv-empty">Todavía no desbloqueaste logros -- juega una partida o resuelve un puzzle.</div>'}
        </div>

        <div class="section-title">Accesos rápidos</div>
        <div class="quick-grid">
          <a class="quick-tile" href="/lobby.html"><span class="q-icon">♟</span><span class="q-label">Jugar Ajedrez</span></a>
          <a class="quick-tile" href="/damas.html"><span class="q-icon">⚫</span><span class="q-label">Jugar Damas</span></a>
          <a class="quick-tile" href="/tournaments.html"><span class="q-icon">🏆</span><span class="q-label">Torneos</span></a>
          <a class="quick-tile" href="/openings.html"><span class="q-icon">📖</span><span class="q-label">Aperturas</span></a>
          <a class="quick-tile" href="/collection.html"><span class="q-icon">👑</span><span class="q-label">Colección</span></a>
          <a class="quick-tile" href="/leaderboard.html"><span class="q-icon">📊</span><span class="q-label">Ranking</span></a>
          <a class="quick-tile" href="/my-analysis.html"><span class="q-icon">🔍</span><span class="q-label">Mi Análisis</span></a>
        </div>
      `;

      // Feedback de desbloqueo (Fase 17): el dashboard es el "check-in"
      // natural despues de iniciar sesion, asi que es el lugar correcto
      // para avisar de logros nuevos desde la ultima visita.
      if (typeof window.ozCheckNewUnlocks === 'function') window.ozCheckNewUnlocks(achData?.achievements);
    }

    init();
  </script>
</body>
</html>
