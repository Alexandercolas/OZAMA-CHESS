<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://flagcdn.com; media-src 'self'; connect-src 'self' https://ozama-chess.onrender.com">
  <script src="/mobile-runtime.js"></script>
  <meta name="theme-color" content="#0D0B08"/>
  <meta name="color-scheme" content="dark"/>
  <title>OZAMA CHESS - Perfil de jugador</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png?v=5">
  <link rel="manifest" href="/manifest.webmanifest">
  <script src="/pwa.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <script src="/preferences.js?v=20260831-fase25"></script>
  <script src="/toast.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--carbon); color: var(--text); font-family: var(--fb); min-height: 100vh; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; background: rgba(13,11,8,0.97); border-bottom: 1px solid rgba(200,152,60,0.18); }
    .topbar a.brand { color: var(--gold); font-family: var(--ft); font-weight: 900; letter-spacing: 3px; text-decoration: none; font-size: 15px; }
    .topbar a.back { color: var(--dim); text-decoration: none; font-size: 13px; }
    .topbar-links { display: flex; align-items: center; gap: 18px; }
    .wrap { max-width: 780px; margin: 0 auto; padding: 32px 20px 60px; }

    .hero { display: flex; align-items: flex-start; gap: 22px; padding: 6px 0 28px; border-bottom: 1px solid rgba(200,152,60,0.22); margin-bottom: 26px; }
    .hero-main { min-width: 0; flex: 1; }
    .av { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; flex: 0 0 76px; background: linear-gradient(135deg, var(--gold), #8B6914); display: flex; align-items: center; justify-content: center; font-family: var(--ft); font-weight: 900; color: var(--carbon); font-size: 30px; }
    .av img { width: 100%; height: 100%; object-fit: cover; }
    /* Marcos de perfil (Fase 13, ver /collection.html) -- un aro alrededor del avatar. */
    .av[data-frame="bronce"] { box-shadow: 0 0 0 4px #8B5A2B; }
    .av[data-frame="plata"] { box-shadow: 0 0 0 4px #C7CCD1; }
    .av[data-frame="oro"] { box-shadow: 0 0 0 4px #FFD34D; }
    .av[data-frame="racha"] { box-shadow: 0 0 0 4px #E2571C, 0 0 14px 2px rgba(226,87,28,0.5); }
    .av[data-frame="tactico"] { box-shadow: 0 0 0 4px #3F7D4E; }
    .av[data-frame="cazador"] { box-shadow: 0 0 0 4px #7A1F2B; }
    .av[data-frame="centenario"] { box-shadow: 0 0 0 4px #6B4A2A; }
    .av[data-frame="campeon"] { box-shadow: 0 0 0 4px #FFD700, 0 0 18px 3px rgba(255,215,0,0.55); }
    /* Le faltaba a "Marco de Temporada" (services/cosmetics.js) -- el
       marco mas raro de todos (legendario, campeon de UNA temporada
       entera) se equipaba sin problema pero nunca se veia en ningun
       lado, por falta de esta regla. */
    .av[data-frame="temporada"] { box-shadow: 0 0 0 4px #7FB8E8, 0 0 18px 3px rgba(127,184,232,0.55); }
    .name { font-family: var(--ft); font-size: 34px; line-height: 1; color: var(--text); overflow-wrap: anywhere; margin: 0; }
    .name .pro { font-size: 10px; vertical-align: middle; margin-left: 8px; padding: 2px 7px; border-radius: 5px; background: rgba(200,152,60,0.16); color: var(--gold); font-weight: 800; letter-spacing: 1px; }
    .title-tag { font-family: var(--fm); font-size: 11px; text-transform: uppercase; color: var(--gold-2, var(--gold)); margin-top: 7px; }
    .cc, .since { color: var(--dim); font-size: 12px; margin-top: 7px; }
    .cc img { width: 16px; height: 12px; object-fit: cover; vertical-align: middle; margin-right: 6px; }
    .bio { margin-top: 12px; font-size: 13px; color: var(--text); line-height: 1.5; overflow-wrap: anywhere; }
    .friend-status { display: inline-block; margin-left: 9px; color: #90C8A2; font: 700 10px var(--fm); vertical-align: middle; }
    .section-heading { font-family: var(--ft); font-size: 21px; color: var(--text); margin: 0 0 12px; }

    /* Tarjeta de jugador (Fase C, roadmap PRO 2.0): ambos juegos a la
       vista al mismo tiempo -- mismas clases/estilo que dashboard.html
       para que se sienta como la misma pieza de UI en las dos paginas. */
    .games-row { display: flex; gap: 12px; margin-bottom: 18px; }
    .game-summary { flex: 1; min-width: 0; background: var(--s1); border: 1px solid rgba(200,152,60,0.16); border-radius: 6px; padding: 14px; text-align: left; }
    .game-summary .g-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .game-summary .g-elo { font-family: var(--fm); font-weight: 700; font-size: 22px; color: var(--gold); }
    .game-summary .g-rank { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .game-summary .g-streak { font-size: 10.5px; color: var(--faint, var(--dim)); margin-top: 6px; }
    .game-summary .g-streak strong { color: var(--gold-2, var(--gold)); }

    .badges-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 24px; }
    .badge-chip { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--s1); border: 1px solid rgba(200,152,60,0.16); border-radius: 6px; padding: 10px 12px; min-width: 68px; }
    .badge-chip .b-icon { font-size: 20px; }
    .badge-chip .b-name { font-size: 9px; color: var(--dim); text-align: center; line-height: 1.3; }

    .game-tabs { display: inline-flex; gap: 0; margin-bottom: 16px; border: 1px solid rgba(200,152,60,0.24); border-radius: 5px; overflow: hidden; }
    .game-tab { padding: 9px 18px; cursor: pointer; background: transparent; border: 0; color: var(--dim); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .game-tab.active { color: var(--gold); border-color: rgba(200,152,60,0.45); background: rgba(200,152,60,0.08); }

    .stats-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 26px; }
    .stat-chip { background: var(--s1); border: 1px solid rgba(200,152,60,0.16); border-radius: 6px; padding: 12px 8px; text-align: center; }
    .stat-chip .v { font-family: var(--fm); font-weight: 700; font-size: 19px; color: var(--gold); }
    .stat-chip .l { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 3px; }
    .rank-badge { text-align: center; font-family: var(--fm); font-size: 12px; color: var(--gold); margin-bottom: 20px; letter-spacing: 0.5px; }

    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 10px 16px; border-radius: 5px; border: 1px solid rgba(200,152,60,0.3); background: rgba(200,152,60,0.08); color: var(--gold); font-weight: 700; font-size: 12px; text-transform: uppercase; cursor: pointer; text-align: center; text-decoration: none; font-family: var(--fb); }
    .btn.primary { background: var(--gold); color: var(--carbon); }
    .btn:hover { border-color: var(--gold); }
    .btn.danger { border-color: rgba(200,60,60,0.35); color: #E39494; background: rgba(200,60,60,0.08); }
    .btn.danger:hover { border-color: #E39494; }

    .more-actions { margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(200,152,60,0.15); }
    .more-actions summary { color: var(--dim); cursor: pointer; font-size: 12px; }
    .panel { background: var(--s1); border: 1px solid rgba(200,152,60,0.18); border-radius: 6px; padding: 16px; margin-top: 14px; display: none; }
    .panel.open { display: block; }
    .panel h3 { font-family: var(--ft); font-size: 15px; color: var(--gold); margin: 0 0 10px; }
    .reason-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .reason-row label { font-size: 12.5px; color: var(--text); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    textarea { width: 100%; background: var(--s2); border: 1px solid rgba(200,152,60,0.2); border-radius: 6px; color: var(--text); padding: 8px; font-family: var(--fb); font-size: 12.5px; resize: vertical; min-height: 60px; }

    .msg { text-align: center; font-size: 12.5px; margin-top: 10px; padding: 8px; border-radius: 6px; display: none; }
    .msg.ok { display: block; background: rgba(46,160,67,0.14); color: #7FD98A; }
    .msg.err { display: block; background: rgba(200,60,60,0.12); color: #E39494; }
    .loading, .error-msg { text-align: center; padding: 60px 20px; color: var(--dim); }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    @media (max-width: 560px) {
      .topbar { padding: 12px 16px; }
      .topbar a.brand { font-size: 13px; }
      .wrap { padding: 24px 16px 48px; }
      .hero { gap: 16px; }
      .av { width: 62px; height: 62px; flex-basis: 62px; font-size: 25px; }
      .name { font-size: 27px; }
      .games-row { gap: 8px; }
      .game-summary { padding: 12px 10px; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat-chip:last-child { grid-column: span 2; }
      .actions .btn { flex: 1 1 calc(50% - 8px); }
    }
  </style>
</head>
<body>
  <nav class="topbar"><a class="brand" href="/">OZAMA CHESS</a><div class="topbar-links"><a class="back" href="/leaderboard.html">Ranking</a><a class="back" id="profile-link" href="/profile.html" hidden>Mi perfil</a></div></nav>
  <div class="wrap" id="content"><div class="loading">Cargando perfil...</div></div>

  <script>
    let _token = '';
    let profile = null;
    let meta = null;
    let _viewerUsername = '';
    let activeGame = 'chess';

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
    }

    // Notificacion (Fase 16) -- toast compartido en vez de alert(). Si
    // por algo el script no cargo todavia, cae de vuelta a alert()
    // como red de seguridad, nunca se pierde el aviso.
    function notify(message, type = 'error') {
      if (typeof window.ozToast === 'function') window.ozToast(message, type);
      else alert(message);
    }
    function flagUrl(country) {
      const code = String(country || 'DO').toLowerCase();
      return /^[a-z]{2}$/.test(code) ? `https://flagcdn.com/24x18/${code}.png` : '';
    }
    function avatarHtml(u) {
      if (u.avatarImage) return `<img src="${escapeHtml(u.avatarImage)}" alt="">`;
      return escapeHtml((u.username || '?').charAt(0).toUpperCase());
    }

    async function load() {
      const username = new URLSearchParams(window.location.search).get('u');
      const content = document.getElementById('content');
      if (!username) { content.innerHTML = '<div class="error-msg">Falta el usuario.</div>'; return; }
      try {
        window.OZAMA_RUNTIME && await window.OZAMA_RUNTIME.ready;
        _token = window.OZAMA_RUNTIME?.getAuthToken?.() || '';
        const res = await fetch(`/api/user/${encodeURIComponent(username)}`, {
          headers: _token ? { Authorization: `Bearer ${_token}` } : {},
          cache: 'no-store',
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo cargar el perfil.');
        profile = data.user;
        meta = { isSelf: data.isSelf, isBlocked: data.isBlocked, isFriend: data.isFriend };
        _viewerUsername = data.viewerUsername || '';
        document.getElementById('profile-link').hidden = !_viewerUsername;
        render();
      } catch (err) {
        content.innerHTML = `<div class="error-msg">${escapeHtml(err.message || 'No se pudo cargar el perfil.')}</div>`;
      }
    }

    function statsFor(game) {
      const s = game === 'damas' ? profile.damasStats : profile.stats;
      const elo = game === 'damas' ? profile.damasElo : profile.elo;
      const rank = game === 'damas' ? profile.damasRank : profile.rank;
      const games = (s?.wins || 0) + (s?.losses || 0) + (s?.draws || 0);
      const winrate = games ? Math.round(((s?.wins || 0) / games) * 100) : 0;
      return { elo, rank, wins: s?.wins || 0, losses: s?.losses || 0, draws: s?.draws || 0, games, winrate, streak: s?.streak || 0 };
    }

    function render() {
      const s = statsFor(activeGame);
      document.getElementById('content').innerHTML = `
        <div class="hero">
          <div class="av" data-frame="${escapeHtml(profile.equippedFrame || 'ninguno')}">${avatarHtml(profile)}</div>
          <div class="hero-main">
            <h1 class="name">${escapeHtml(profile.username)}${profile.premiumActive ? '<span class="pro">PRO</span>' : ''}${meta.isFriend ? '<span class="friend-status">Amigo</span>' : ''}</h1>
            <div class="title-tag">${escapeHtml(profile.globalTitle || 'Novato')}</div>
            <div class="cc">${flagUrl(profile.country) ? `<img src="${flagUrl(profile.country)}" alt="">` : ''}${escapeHtml(profile.country || '')} · Nivel ${profile.level} · ${profile.achievementsUnlocked} logros</div>
            <div class="since">Miembro desde ${new Date(profile.createdAt).toLocaleDateString('es-DO', { month: 'long', year: 'numeric' })}</div>
            ${profile.bio ? `<p class="bio">${escapeHtml(profile.bio)}</p>` : ''}
          </div>
        </div>
        <h2 class="section-heading">Rendimiento</h2>
        <div class="games-row">
          <div class="game-summary">
            <div class="g-label">♟ Ajedrez</div>
            <div class="g-elo">${profile.elo}</div>
            <div class="g-rank">${escapeHtml(profile.rank)}</div>
            <div class="g-streak">Racha <strong>${profile.stats?.streak || 0}</strong></div>
          </div>
          <div class="game-summary">
            <div class="g-label">⚫ Damas</div>
            <div class="g-elo">${profile.damasElo}</div>
            <div class="g-rank">${escapeHtml(profile.damasRank)}</div>
            <div class="g-streak">Racha <strong>${profile.damasStats?.streak || 0}</strong></div>
          </div>
        </div>
        ${(profile.badges || []).length ? `
          <h2 class="section-heading">Logros recientes</h2>
          <div class="badges-strip">
            ${profile.badges.map((b) => `
              <div class="badge-chip" title="${escapeHtml(b.name)}">
                <span class="b-icon">${escapeHtml(b.icon)}</span>
                <span class="b-name">${escapeHtml(b.name)}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
        <h2 class="section-heading">Estadisticas de ${activeGame === 'chess' ? 'ajedrez' : 'Damas'}</h2>
        <div class="game-tabs">
          <button type="button" class="game-tab ${activeGame === 'chess' ? 'active' : ''}" aria-pressed="${activeGame === 'chess'}" onclick="switchGame('chess')">Ajedrez</button>
          <button type="button" class="game-tab ${activeGame === 'damas' ? 'active' : ''}" aria-pressed="${activeGame === 'damas'}" onclick="switchGame('damas')">Damas</button>
        </div>
        <div class="stats-grid">
          <div class="stat-chip"><div class="v">${s.wins}</div><div class="l">Victorias</div></div>
          <div class="stat-chip"><div class="v">${s.losses}</div><div class="l">Derrotas</div></div>
          <div class="stat-chip"><div class="v">${s.draws}</div><div class="l">Tablas</div></div>
          <div class="stat-chip"><div class="v">${s.games}</div><div class="l">Partidas</div></div>
          <div class="stat-chip"><div class="v">${s.winrate}%</div><div class="l">Efectividad</div></div>
        </div>
        ${meta.isSelf ? '<a class="btn" href="/profile.html">Ir a mi perfil</a>' : !_viewerUsername ? '<a class="btn primary" href="/login.html">Iniciar sesion para desafiar</a>' : `
          <h2 class="section-heading">Jugar juntos</h2>
          <div class="actions">
            <a class="btn primary" href="/lobby.html?challenge=${encodeURIComponent(profile.username || '')}">Desafiar</a>
            <button type="button" class="btn" id="friend-btn" onclick="toggleFriend()">${meta.isFriend ? 'Quitar amigo' : 'Agregar amigo'}</button>
            <a class="btn" href="/history.html?opponent=${encodeURIComponent(profile.username || '')}">Nuestras partidas</a>
            <a class="btn" href="/compare.html?a=${encodeURIComponent(_viewerUsername || '')}&b=${encodeURIComponent(profile.username || '')}">Comparar</a>
          </div>
          <details class="more-actions">
            <summary>Seguridad y moderacion</summary>
            <div class="actions">
              <button type="button" class="btn" onclick="togglePanel('report')">Reportar</button>
              <button type="button" class="btn danger" id="block-btn" onclick="toggleBlock()">${meta.isBlocked ? 'Desbloquear' : 'Bloquear'}</button>
            </div>
            <div class="panel" id="panel-report">
              <h3>Reportar a ${escapeHtml(profile.username)}</h3>
              <div class="reason-row">
                <label><input type="radio" name="reason" value="comportamiento_toxico" checked> Comportamiento toxico</label>
                <label><input type="radio" name="reason" value="trampa_sospechada"> Sospecha de trampa</label>
                <label><input type="radio" name="reason" value="nombre_inapropiado"> Nombre de usuario inapropiado</label>
                <label><input type="radio" name="reason" value="otro"> Otro motivo</label>
              </div>
              <textarea id="report-note" placeholder="Detalles (opcional)"></textarea>
              <div class="actions"><button type="button" class="btn" onclick="submitReport()">Enviar reporte</button></div>
              <div class="msg" id="report-msg"></div>
            </div>
          </details>
        `}
      `;
    }

    function switchGame(game) { activeGame = game; render(); }

    function togglePanel(name) {
      const el = document.getElementById(`panel-${name}`);
      if (el) el.classList.toggle('open');
    }

    async function submitReport() {
      if (!_viewerUsername) { showMsg('report-msg', 'Inicia sesión para reportar jugadores.', 'err'); return; }
      const reason = document.querySelector('input[name="reason"]:checked')?.value || 'otro';
      const note = document.getElementById('report-note').value.trim();
      try {
        const res = await fetch(`/api/user/${encodeURIComponent(profile.username)}/report`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
          body: JSON.stringify({ reason, note }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo enviar el reporte.');
        showMsg('report-msg', 'Reporte enviado. Gracias por ayudar a cuidar la comunidad.', 'ok');
      } catch (err) {
        showMsg('report-msg', err.message || 'Error al reportar.', 'err');
      }
    }

    async function toggleFriend() {
      if (!_viewerUsername) { notify('Inicia sesión para agregar amigos.', 'info'); return; }
      try {
        const method = meta.isFriend ? 'DELETE' : 'POST';
        const res = await fetch(`/api/user/friends/${encodeURIComponent(profile.username)}`, {
          method, headers: { Authorization: `Bearer ${_token}` },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo actualizar la amistad.');
        meta.isFriend = !meta.isFriend;
        render();
      } catch (err) {
        notify(err.message || 'Error al agregar amigo.');
      }
    }

    async function toggleBlock() {
      if (!_viewerUsername) { notify('Inicia sesión para bloquear jugadores.', 'info'); return; }
      try {
        const method = meta.isBlocked ? 'DELETE' : 'POST';
        const res = await fetch(`/api/user/${encodeURIComponent(profile.username)}/block`, {
          method, headers: { Authorization: `Bearer ${_token}` },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo actualizar el bloqueo.');
        meta.isBlocked = !meta.isBlocked;
        render();
      } catch (err) {
        notify(err.message || 'Error al bloquear.');
      }
    }

    function showMsg(id, text, kind) {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = `msg ${kind}`;
      el.textContent = text;
    }

    window.switchGame = switchGame;
    window.togglePanel = togglePanel;
    window.submitReport = submitReport;
    window.toggleBlock = toggleBlock;
    window.toggleFriend = toggleFriend;
    load();
  </script>
</body>
</html>
