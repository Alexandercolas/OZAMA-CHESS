<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'">
  <meta name="theme-color" content="#0D0B08"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>OZAMA DAMAS - Vista previa</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <script src="/checkers-engine.js"></script>
  <script src="/checkers-ai.js"></script>

  <style>
    :root {
      --sq: 58px;
      --board-border: 3px;
      --bl: #D4B896;
      --bd: #5C3A1E;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: var(--carbon);
      color: var(--text);
      font-family: var(--fb);
    }

    .page {
      width: 100%;
      max-width: 880px;
      display: grid;
      gap: 20px;
    }

    .dev-banner {
      border: 1px solid rgba(200,152,60,0.3);
      background: rgba(200,152,60,0.07);
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--dim);
      text-align: center;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--dim);
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: color 0.15s ease;
    }
    .back-link:hover { color: var(--gold-2); }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title {
      font-family: var(--ft);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--gold-2);
      text-transform: uppercase;
    }

    .turn-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(200,152,60,0.3);
      background: var(--s2);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text);
    }
    .turn-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .turn-dot.w { background: radial-gradient(circle at 35% 30%, #F2E4C4, #C8983C 70%); }
    .turn-dot.b { background: radial-gradient(circle at 35% 30%, #4a4038, #16130E 70%); }

    .header-side { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

    .capture-tally {
      display: flex;
      gap: 14px;
      font-family: var(--fm);
      font-size: 11px;
      font-weight: 700;
      color: var(--dim);
      letter-spacing: 0.5px;
    }
    .capture-tally span { display: inline-flex; align-items: center; gap: 5px; }
    .capture-tally .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .capture-tally .dot.w { background: radial-gradient(circle at 35% 30%, #F2E4C4, #C8983C 70%); }
    .capture-tally .dot.b { background: radial-gradient(circle at 35% 30%, #4a4038, #16130E 70%); }

    .board-wrap {
      display: flex;
      justify-content: center;
    }

    .board {
      width: calc(var(--sq) * 8);
      height: calc(var(--sq) * 8);
      display: grid;
      grid-template-columns: repeat(8, var(--sq));
      grid-template-rows: repeat(8, var(--sq));
      border: var(--board-border) solid var(--amber);
      outline: 1px solid rgba(200,152,60,0.28);
      outline-offset: 3px;
      box-shadow:
        0 0 0 5px rgba(13,11,8,0.95),
        0 0 0 6px rgba(200,152,60,0.1),
        0 20px 50px rgba(0,0,0,0.75);
      overflow: hidden;
      position: relative;
      max-width: 100%;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.15s ease;
    }
    .board.thinking { pointer-events: none; opacity: 0.82; }

    .square {
      width: var(--sq);
      height: var(--sq);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .square.light { background: var(--bl); }
    .square.dark  { background: var(--bd); cursor: pointer; }
    .square.dark:hover { filter: brightness(1.08); }

    .square.selected { box-shadow: inset 0 0 0 3px var(--gold); }
    .square.last-from { background: radial-gradient(circle at 50% 50%, rgba(200,152,60,0.24), rgba(91,58,30,0.1) 64%) !important; }
    .square.last-to   { background: radial-gradient(circle at 50% 50%, rgba(232,188,86,0.34), rgba(200,152,60,0.16) 58%) !important; }

    .legal-dot {
      position: absolute;
      width: 26%;
      height: 26%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(220,168,68,0.92), rgba(200,140,40,0.6));
      pointer-events: none;
      z-index: 3;
    }
    .legal-dot.capture {
      width: 82%;
      height: 82%;
      background: transparent;
      border: 3px solid rgba(220,90,60,0.85);
    }

    .piece {
      width: 78%;
      height: 78%;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: transform 0.12s ease;
    }
    .piece.w {
      background: radial-gradient(circle at 35% 28%, #FBF3DE 0%, #E9D6A6 42%, #C8983C 78%, #8B6520 100%);
      box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.5);
    }
    .piece.b {
      background: radial-gradient(circle at 35% 28%, #4a4038 0%, #2a231b 46%, #16130E 82%, #050403 100%);
      box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.12);
    }
    .piece.king::after {
      content: '';
      position: absolute;
      inset: 26%;
      border-radius: 50%;
      border: 2px solid rgba(200,152,60,0.85);
    }
    .square.selected .piece { transform: scale(1.06); }

    .piece.must-move { animation: mustMovePulse 1.1s ease-in-out infinite; }
    @keyframes mustMovePulse {
      0%, 100% { box-shadow: 0 3px 6px rgba(0,0,0,0.5), 0 0 0 0 rgba(210,90,60,0.55); }
      50%      { box-shadow: 0 3px 6px rgba(0,0,0,0.5), 0 0 0 5px rgba(210,90,60,0); }
    }

    .piece.landed { animation: pieceLand 0.22s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes pieceLand {
      from { transform: scale(0.72); }
      to   { transform: scale(1); }
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-mode {
      padding: 11px 22px;
      background: transparent;
      border: 1px solid rgba(200,152,60,0.4);
      color: var(--dim);
      font-family: var(--fb);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-mode:hover { color: var(--gold-2); border-color: var(--gold); }
    .btn-mode.active { color: var(--carbon); background: var(--gold); border-color: var(--gold); }

    .thinking-line {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--gold-2);
      min-height: 16px;
    }

    .status-line {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--dim);
      min-height: 18px;
    }

    @media (max-width: 560px) {
      :root { --sq: clamp(30px, calc((100vw - 40px) / 8), 44px); }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="dev-banner">Vista previa de Damas &mdash; pasa y juega en el mismo dispositivo. Todavia no tiene salas online ni modo invitado/login.</div>

    <a class="back-link" href="/lobby.html">&larr; Volver al lobby</a>

    <div class="header">
      <div class="title">Ozama Damas</div>
      <div class="header-side">
        <div class="capture-tally" id="capture-tally"></div>
        <div class="turn-badge" id="turn-badge">
          <span class="turn-dot w" id="turn-dot"></span>
          <span id="turn-text">Turno: Blancas</span>
        </div>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="status-line" id="status-line"></div>
    <div class="thinking-line" id="thinking-line"></div>

    <div class="controls">
      <button class="btn-primary" type="button" onclick="newGame()">Nueva partida</button>
      <button class="btn-mode" type="button" id="mode-btn" onclick="toggleMode()">Modo: Pasar y jugar</button>
    </div>
  </div>

  <script>
    'use strict';
    const E = window.OzamaCheckers;
    const AI = window.OzamaCheckersAI;
    const BOT_COLOR = E.COLOR.BLACK;
    const BOT_DEPTH = 5;
    let board = E.createInitialBoard();
    let turn = E.COLOR.WHITE;
    let selected = null;      // { r, c }
    let legalHere = [];       // sequences for the selected square
    let lastMove = null;      // { fromR, fromC, toR, toC }
    let gameOver = null;
    let vsBot = false;
    let botThinking = false;

    function pieceEl(piece) {
      const div = document.createElement('div');
      div.className = `piece ${piece.color}${piece.king ? ' king' : ''}`;
      return div;
    }

    function render() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      boardEl.classList.toggle('thinking', botThinking);

      const destSet = new Map(); // "r,c" -> hasCapture
      if (selected) {
        for (const seq of legalHere) {
          const final = seq[seq.length - 1];
          destSet.set(`${final.toR},${final.toC}`, seq[0].capturedR !== -1);
        }
      }

      // Piezas que tienen captura obligatoria disponible este turno --
      // se resaltan para que la regla no sea invisible para quien no
      // conoce Damas dominicana.
      const mustMoveSet = new Set();
      if (!gameOver) {
        for (const entry of E.getAllLegalMoves(board, turn)) {
          if (entry.sequences[0]?.[0]?.capturedR !== -1) mustMoveSet.add(`${entry.r},${entry.c}`);
        }
      }

      for (let r = 0; r < E.SIZE; r++) {
        for (let c = 0; c < E.SIZE; c++) {
          const sq = document.createElement('div');
          const dark = E.isDarkSquare(r, c);
          sq.className = `square ${dark ? 'dark' : 'light'}`;
          if (selected && selected.r === r && selected.c === c) sq.classList.add('selected');
          if (lastMove && ((lastMove.fromR === r && lastMove.fromC === c))) sq.classList.add('last-from');
          if (lastMove && (lastMove.toR === r && lastMove.toC === c)) sq.classList.add('last-to');

          const piece = board[r][c];
          if (piece) {
            const el = pieceEl(piece);
            if (mustMoveSet.has(`${r},${c}`)) el.classList.add('must-move');
            if (lastMove && lastMove.toR === r && lastMove.toC === c) el.classList.add('landed');
            sq.appendChild(el);
          }

          if (destSet.has(`${r},${c}`)) {
            const dot = document.createElement('div');
            dot.className = destSet.get(`${r},${c}`) ? 'legal-dot capture' : 'legal-dot';
            sq.appendChild(dot);
          }

          sq.addEventListener('click', () => onSquareClick(r, c));
          boardEl.appendChild(sq);
        }
      }

      let remainingW = 0, remainingB = 0;
      for (const row of board) for (const cell of row) {
        if (cell?.color === E.COLOR.WHITE) remainingW++;
        if (cell?.color === E.COLOR.BLACK) remainingB++;
      }
      document.getElementById('capture-tally').innerHTML =
        `<span><span class="dot b"></span>${12 - remainingB} capturadas</span>` +
        `<span><span class="dot w"></span>${12 - remainingW} capturadas</span>`;

      document.getElementById('turn-dot').className = `turn-dot ${turn}`;
      document.getElementById('turn-text').textContent = gameOver
        ? 'Partida terminada'
        : `Turno: ${turn === E.COLOR.WHITE ? 'Blancas' : 'Negras'}`;

      const statusEl = document.getElementById('status-line');
      if (gameOver) {
        const winnerLabel = gameOver.winner === E.COLOR.WHITE ? 'Blancas' : 'Negras';
        const reasonLabel = gameOver.reason === 'no-pieces' ? 'sin piezas' : 'sin movimientos';
        statusEl.textContent = `Ganaron las ${winnerLabel} (rival ${reasonLabel}).`;
      } else {
        statusEl.textContent = '';
      }
    }

    function onSquareClick(r, c) {
      if (gameOver || botThinking) return;
      if (vsBot && turn === BOT_COLOR) return;
      const clicked = board[r][c];

      // Clicking a destination while something is selected.
      if (selected) {
        const seq = legalHere.find((s) => s[s.length - 1].toR === r && s[s.length - 1].toC === c);
        if (seq) {
          applyMoveAndAdvance(selected.r, selected.c, seq);
          return;
        }
      }

      // Selecting/deselecting a piece.
      if (clicked && clicked.color === turn) {
        const moves = E.getLegalMovesForSquare(board, r, c);
        if (!moves.length) {
          selected = null;
          legalHere = [];
          render();
          return;
        }
        selected = { r, c };
        legalHere = moves;
        render();
        return;
      }

      selected = null;
      legalHere = [];
      render();
    }

    function applyMoveAndAdvance(fromR, fromC, seq) {
      const result = E.applyMove(board, fromR, fromC, seq);
      board = result.board;
      lastMove = { fromR, fromC, toR: result.to.r, toC: result.to.c };
      selected = null;
      legalHere = [];
      turn = E.otherColor(turn);

      const status = E.checkGameOver(board, turn);
      gameOver = status.over ? status : null;
      render();

      if (vsBot && !gameOver && turn === BOT_COLOR) scheduleBotMove();
    }

    function scheduleBotMove() {
      botThinking = true;
      document.getElementById('thinking-line').textContent = 'El bot esta pensando...';
      document.getElementById('board').classList.add('thinking');
      setTimeout(() => {
        const move = AI.chooseMove(board, BOT_COLOR, BOT_DEPTH);
        botThinking = false;
        document.getElementById('thinking-line').textContent = '';
        if (!move) return; // no debería pasar: checkGameOver ya lo hubiera detectado antes.
        applyMoveAndAdvance(move.r, move.c, move.seq);
      }, 350);
    }

    function toggleMode() {
      vsBot = !vsBot;
      const btn = document.getElementById('mode-btn');
      btn.textContent = vsBot ? 'Modo: Vs Bot (negras)' : 'Modo: Pasar y jugar';
      btn.classList.toggle('active', vsBot);
      newGame();
    }

    function newGame() {
      board = E.createInitialBoard();
      turn = E.COLOR.WHITE;
      selected = null;
      legalHere = [];
      lastMove = null;
      gameOver = null;
      botThinking = false;
      document.getElementById('thinking-line').textContent = '';
      render();
    }

    render();
  </script>
</body>
</html>
